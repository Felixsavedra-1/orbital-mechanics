<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VR-03 — orbit visual capture harness</title>
<style>
  /* Mirrors the portfolio card exactly (Downloads/index.html .plot-canvas):
     scene drawn in logical 256x160, backing store 2x (512x320) for crisp
     supersampling, with the same gradient panel + thin border. */
  html,body{margin:0;background:#0A0A0B;}
  #stage{width:256px;height:160px;}
  #c{
    width:256px;height:160px;display:block;
    border:1px solid #26262B;border-radius:2px;
    background:linear-gradient(180deg,#111113,#0A0A0B);
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="512" height="320"></canvas></div>
<script>
// ---------------------------------------------------------------------------
// VR-03 orbit visual — copied verbatim from the Vedra Research site
// (index.html drawOrbit + helpers) so the README GIF is pixel-faithful to the
// project's thumbnail on the company website. drawOrbit itself is unchanged; the
// only adaptation is how it's driven for a seamless loop:
//   * both `phi` (whole-scene rotation) and `tau` (spacecraft transit fraction)
//     are explicit parameters driven by renderFrame(i, count) as exact functions
//     of the frame index, so frame `count` returns to frame 0 with no jump;
//   * `phi` sweeps exactly one full revolution (+2π) over the loop and `tau`
//     completes an integer number of transits (NTRANSITS) — the site's true
//     transit-to-rotation cadence (~0.22 / (0.12/2π) ≈ 11.5, rounded to 12);
//   * the scene is drawn in the site's native 256x160 logical space (ctx
//     scaled 2x onto a 512x320 backing) so body sizes stay portfolio-true.
// ---------------------------------------------------------------------------
var GOLD='178,58,58', CRIM='178,58,58', GREY='140,140,147', BONE='#E8E3D6', BONE_RGB='232,227,214';
var PHI0=0.6;       // base orientation (the site's own phi offset): Mars upper-left, Earth lower-right
var NTRANSITS=12;   // spacecraft transits per full revolution — the site's true cadence

function grid(ctx,W,H){
  ctx.strokeStyle='rgba(38,38,43,0.85)'; ctx.lineWidth=1;
  for(var x=0;x<=W;x+=W/8){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=0;y<=H;y+=H/8){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}
function dot(ctx,x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
function ring(ctx,x,y,r,s){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle=s;ctx.lineWidth=1;ctx.stroke();}
function glow(ctx,x,y,r,rgb,a){
  var g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba('+rgb+','+a+')'); g.addColorStop(1,'rgba('+rgb+',0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
}
function tail(ctx,pts,rgb,maxA,maxW){
  ctx.lineCap='round';
  for(var i=0;i<pts.length-1;i++){
    var f=1-i/(pts.length-1);
    ctx.strokeStyle='rgba('+rgb+','+(maxA*f).toFixed(3)+')';
    ctx.lineWidth=Math.max(0.4,maxW*f);
    ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[i+1].x,pts[i+1].y);ctx.stroke();
  }
  ctx.lineCap='butt';
}

function drawOrbit(ctx,W,H,phi,tau){
  grid(ctx,W,H);
  var cx=W*0.5, cy=H*0.5, UX=W*0.30, UY=H*0.30;   // screen length of Earth's orbit radius
  var k=1.524;                                      // real Mars/Earth semi-major axis ratio
  var e=(k-1)/(k+1), p=1*(1+e);                     // transfer ellipse, Sun at focus, perihelion=Earth
  function sx(nx){return cx+nx*UX;} function sy(ny){return cy+ny*UY;}
  // orbits
  ctx.beginPath();ctx.ellipse(cx,cy,UX,UY,0,0,Math.PI*2);ctx.strokeStyle='rgba('+GREY+',0.30)';ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx,cy,k*UX,k*UY,0,0,Math.PI*2);ctx.strokeStyle='rgba('+GREY+',0.20)';ctx.lineWidth=1;ctx.stroke();
  // Sun at focus
  glow(ctx,cx,cy,18,GOLD,0.5); dot(ctx,cx,cy,3,'rgba('+GOLD+',0.95)'); ring(ctx,cx,cy,6,'rgba('+GOLD+',0.28)');
  // planned transfer trajectory (dashed arc, perihelion at Earth -> aphelion at Mars)
  ctx.save();ctx.setLineDash([4,4]);ctx.beginPath();
  for(var i=0;i<=90;i++){var nu=i/90*Math.PI,r=p/(1+e*Math.cos(nu)),L=phi+nu;
    var X=sx(r*Math.cos(L)),Y=sy(r*Math.sin(L));if(i===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);}
  ctx.strokeStyle='rgba('+GOLD+',0.30)';ctx.lineWidth=1.1;ctx.stroke();ctx.restore();
  // Earth at departure node
  var eX=sx(Math.cos(phi)),eY=sy(Math.sin(phi));
  glow(ctx,eX,eY,7,BONE_RGB,0.45); dot(ctx,eX,eY,2.6,BONE); ring(ctx,eX,eY,5,'rgba(232,227,214,0.30)');
  // Mars at arrival node
  var mX=sx(-k*Math.cos(phi)),mY=sy(-k*Math.sin(phi));
  glow(ctx,mX,mY,9,GOLD,0.55); dot(ctx,mX,mY,2.8,'rgba('+GOLD+',0.95)'); ring(ctx,mX,mY,5.5,'rgba('+GOLD+',0.30)');
  // spacecraft in transit — tau is the transit fraction (0..1), driven externally
  var nu=tau*Math.PI;
  var env=Math.min(1,Math.min(tau,1-tau)/0.08); if(env<0)env=0;
  var pts=[];
  for(var s=0;s<22;s++){var nv=nu-s*0.06; if(nv<0)break;
    var rr=p/(1+e*Math.cos(nv)),LL=phi+nv;pts.push({x:sx(rr*Math.cos(LL)),y:sy(rr*Math.sin(LL))});}
  ctx.globalAlpha=env;
  if(pts.length>1) tail(ctx,pts,GOLD,0.95,2.6);
  var rH=p/(1+e*Math.cos(nu)),LH=phi+nu;
  glow(ctx,sx(rH*Math.cos(LH)),sy(rH*Math.sin(LH)),7,GOLD,0.6); dot(ctx,sx(rH*Math.cos(LH)),sy(rH*Math.sin(LH)),2.2,BONE);
  ctx.globalAlpha=1;
}

var stage=document.getElementById('c');
var ctx=stage.getContext('2d');
ctx.scale(2,2);   // backing 512x320, scene drawn in logical 256x160 (portfolio-native)

// Render frame i of `count`. One full pass is exactly one revolution of the whole
// configuration (phi sweeps +2π) and NTRANSITS spacecraft transits — both exact
// functions of i/count, so frame `count` lands back on frame 0 with no jump. The
// craft's `env` still fades it at each tau wrap, so the per-transit seam is clean
// too. clearRect (not a solid fill) lets the CSS gradient panel show through,
// matching the portfolio card. Called by the puppeteer capture script.
window.renderFrame=function(i,count){
  var f=i/count;
  var phi=PHI0+2*Math.PI*f;     // one full seamless revolution
  var tau=(f*NTRANSITS)%1;      // NTRANSITS seamless spacecraft transits
  ctx.clearRect(0,0,256,160);
  drawOrbit(ctx,256,160,phi,tau);
};

// Initial frame so a plain open shows something.
window.renderFrame(0,50);
</script>
</body>
</html>
