<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbital Mechanics — Mission Console</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      /* foreground — bone-white #ECE5D5 = 236,229,213 */
      --ink:        rgba(236, 229, 213, 0.88);
      --ink-dim:    rgba(236, 229, 213, 0.58);
      --ink-faint:  rgba(236, 229, 213, 0.34);
      --hair:       rgba(236, 229, 213, 0.14);

      /* accents */
      --crimson:        #D6203F;   /* bright — live/active text & glyphs */
      --crimson-deep:   #B3122B;   /* deep  — borders, fills, hovers */
      --titanium:       #9DA3A8;   /* neutral secondary */
      --gold:           #C7A06A;   /* positive / completed */

      --mono: 'Courier New', ui-monospace, monospace;
    }
    body { background: #000; overflow: hidden; color: var(--ink); }
    canvas { display: block; }

    /* Top tab bar */
    #tabs {
      position: absolute;
      top: 18px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--hair);
      border-radius: 999px;
      background: rgba(8, 10, 18, 0.5);
      backdrop-filter: blur(6px);
      z-index: 10;
    }
    .tab {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--ink-faint);
      font: 11px var(--mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 7px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.25s, background 0.25s;
    }
    .tab:hover { color: var(--ink-dim); }
    .tab.active {
      color: #06080f;
      background: rgba(236, 229, 213, 0.9);
    }
    .tab .key {
      opacity: 0.5;
      font-size: 9px;
      margin-left: 6px;
    }
    .tab.active .key { opacity: 0.45; }

    /* HUD (top-left, per-view) */
    #hud {
      position: absolute;
      top: 18px; left: 18px;
      max-width: 340px;
      color: var(--ink-dim);
      font: 11px/1.9 var(--mono);
      letter-spacing: 0.04em;
      pointer-events: none;
      z-index: 5;
    }
    #hud strong {
      display: block;
      color: var(--ink);
      font-size: 13px;
      letter-spacing: 0.14em;
      margin-bottom: 4px;
    }
    #hud .accent { color: var(--crimson); }

    /* Speed control (bottom-center) */
    #controls {
      position: absolute;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--ink-dim);
      font: 11px var(--mono);
      letter-spacing: 0.08em;
      z-index: 5;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 200px; height: 2px;
      background: rgba(157, 163, 168, 0.4);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: rgba(236, 229, 213, 0.9);
      cursor: pointer;
    }

    /* Live mission caption (bottom, per-view) */
    #status {
      position: absolute;
      bottom: 58px; left: 50%;
      transform: translateX(-50%);
      color: var(--ink-dim);
      font: 11px var(--mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 5;
    }
    #status.on { opacity: 1; }
    #status .accent { color: var(--crimson); }

    /* Stepped info panel (right, per-view) */
    #info-panel {
      position: absolute;
      top: 50%; right: 22px;
      transform: translateY(-50%);
      width: 250px;
      padding: 16px 18px;
      border: 1px solid var(--hair);
      border-radius: 12px;
      background: rgba(8, 10, 18, 0.5);
      backdrop-filter: blur(6px);
      color: var(--ink-dim);
      font: 10px/1.6 var(--mono);
      letter-spacing: 0.04em;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 6;
    }
    #info-panel.on { opacity: 1; }
    #info-panel h4,
    #body-nav .bn-detail h4 {
      color: var(--ink);
      font-size: 12px;
      letter-spacing: 0.14em;
      margin-bottom: 2px;
    }
    #info-panel .sub { color: var(--ink-faint); margin-bottom: 12px; }
    #info-panel .step {
      padding: 7px 0 7px 14px;
      border-left: 1px solid var(--hair);
      color: var(--ink-faint);
      transition: color 0.3s, border-color 0.3s;
    }
    #info-panel .step + .step { margin-top: 2px; }
    #info-panel .step strong {
      display: block;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    #info-panel .step.active {
      color: var(--ink-dim);
      border-left-color: var(--crimson);
    }
    #info-panel .step.active strong { color: var(--crimson); text-shadow: 0 0 10px rgba(214, 32, 63, 0.45); }
    #info-panel .dv { color: var(--ink-dim); }

    /* Planet close-up data sheet (reuses #info-panel; also docks in #body-nav) */
    #info-panel .blurb,
    #body-nav .bn-detail .blurb {
      color: var(--ink-dim);
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--hair);
    }
    #info-panel .sheet .row,
    #body-nav .bn-detail .sheet .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
    }
    #info-panel .sheet .row + .row,
    #body-nav .bn-detail .sheet .row + .row { border-top: 1px solid rgba(236, 229, 213, 0.07); }
    #info-panel .sheet .row .k,
    #body-nav .bn-detail .sheet .row .k {
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    #info-panel .sheet .row .v,
    #body-nav .bn-detail .sheet .row .v { color: var(--ink); text-align: right; }
    #info-panel .hint,
    #body-nav .bn-detail .hint {
      margin-top: 12px;
      color: var(--ink-faint);
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    /* Body picker (top-right, Solar System tab) */
    #body-nav {
      position: absolute;
      top: 64px; right: 22px;
      display: none;                 /* shown only on the Solar System tab */
      flex-direction: column;
      padding: 10px 12px 10px;
      width: 210px;
      max-height: calc(100vh - 86px);
      overflow-y: auto;
      border: 1px solid var(--hair);
      border-radius: 12px;
      background: rgba(8, 10, 18, 0.5);
      backdrop-filter: blur(6px);
      z-index: 7;
    }
    #body-nav::-webkit-scrollbar { width: 6px; }
    #body-nav::-webkit-scrollbar-thumb { background: rgba(236, 229, 213, 0.14); border-radius: 3px; }
    #body-nav .bn-list { display: flex; flex-direction: column; gap: 2px; }
    /* Selected-body data sheet, docked beneath the picker as one console box */
    #body-nav .bn-detail {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--hair);
      color: var(--ink-dim);
      font: 10px/1.6 var(--mono);
      letter-spacing: 0.04em;
    }
    #body-nav.has-detail .bn-detail { display: block; }
    #body-nav .bn-title {
      color: var(--ink-faint);
      font: 9px var(--mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0 4px 6px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--hair);
    }
    #body-nav .bn-item {
      appearance: none;
      border: 0;
      background: transparent;
      text-align: left;
      color: var(--ink-faint);
      font: 10px var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }
    #body-nav .bn-item:hover { color: var(--ink); background: rgba(236, 229, 213, 0.06); }
    #body-nav .bn-item.active {
      color: var(--crimson);
      background: rgba(214, 32, 63, 0.12);
    }

    /* Projected body labels */
    #label-layer { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
    .plabel {
      position: absolute;
      color: var(--ink-dim);
      font: 9px/1 var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transform: translate(-50%, -100%);
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .plabel.faint { color: var(--ink-faint); }

    /* Mission Plan launch button (Moon & Mars tabs) */
    #mission-cta {
      position: absolute;
      bottom: 24px; left: 22px;
      display: none;                 /* shown on moon/mars tabs only */
      align-items: center;
      gap: 9px;
      padding: 9px 17px;
      border: 1px solid rgba(214, 32, 63, 0.5);
      border-radius: 999px;
      background: rgba(8, 10, 18, 0.5);
      backdrop-filter: blur(6px);
      color: var(--crimson);
      font: 11px var(--mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      z-index: 8;
      box-shadow: 0 0 14px rgba(214, 32, 63, 0.22);
      text-shadow: 0 0 8px rgba(214, 32, 63, 0.35);
      transition: color 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    #mission-cta:hover { background: rgba(214, 32, 63, 0.14); border-color: rgba(214, 32, 63, 0.8); box-shadow: 0 0 18px rgba(214, 32, 63, 0.38); }
    #mission-cta .glyph { font-size: 9px; transform: translateY(0.5px); }
    #mission-cta.running { color: var(--ink-faint); border-color: var(--hair); cursor: default; box-shadow: none; text-shadow: none; }
    #mission-cta.running:hover { background: rgba(8, 10, 18, 0.5); border-color: var(--hair); box-shadow: none; }

    /* Mission timeline (bottom, during a plan) — launch-broadcast feel */
    #mission-bar {
      position: absolute;
      bottom: 86px; left: 50%;
      transform: translateX(-50%);
      display: none;
      flex-direction: column;
      gap: 9px;
      width: min(640px, 84vw);
      padding: 13px 18px 14px;
      border: 1px solid var(--hair);
      border-radius: 12px;
      background: rgba(8, 10, 18, 0.58);
      backdrop-filter: blur(8px);
      z-index: 8;
    }
    #mission-bar.on { display: flex; }
    #mission-bar .mb-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      font: 9px var(--mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }
    #mission-bar .mb-head .phase { color: var(--crimson); letter-spacing: 0.13em; flex: 1; text-align: center; text-shadow: 0 0 9px rgba(214, 32, 63, 0.4); }
    #mission-bar .mb-head .clock { font-variant-numeric: tabular-nums; }
    #mission-bar .mb-track { display: flex; gap: 4px; }
    #mission-bar .seg {
      position: relative; flex: 1; height: 3px;
      border-radius: 2px;
      background: rgba(236, 229, 213, 0.12);
      overflow: hidden;
    }
    #mission-bar .seg .fill {
      position: absolute; inset: 0 auto 0 0; width: 0%;
      background: var(--crimson);
      box-shadow: 0 0 8px rgba(214, 32, 63, 0.55);
      transition: width 0.08s linear;
    }
    #mission-bar .seg.done .fill { width: 100% !important; background: var(--gold); box-shadow: 0 0 7px rgba(199, 160, 106, 0.45); }
    #mission-bar .mb-ctrls {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      font: 9px var(--mono); letter-spacing: 0.12em; color: var(--ink-faint);
    }
    #mission-bar .mb-ctrls .cap { text-transform: uppercase; }
    #mission-bar .mb-ctrls .btns { display: flex; gap: 6px; }
    #mission-bar button.mb-btn {
      appearance: none;
      border: 1px solid var(--hair);
      background: transparent;
      color: var(--ink-dim);
      font: 9px var(--mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    #mission-bar button.mb-btn:hover { color: var(--ink); border-color: var(--ink-faint); }

    /* Plan-mode info-panel: numbered phase list + active-phase callout */
    #info-panel .plan-list { margin-bottom: 13px; }
    #info-panel .pl-row {
      display: flex; align-items: baseline; gap: 9px;
      padding: 4px 0;
      color: var(--ink-faint);
      transition: color 0.25s;
    }
    #info-panel .pl-row .n {
      width: 13px; flex: none; text-align: center;
      font-size: 9px; color: var(--ink-faint);
    }
    #info-panel .pl-row .nm { letter-spacing: 0.1em; text-transform: uppercase; font-size: 10px; }
    #info-panel .pl-row.done { color: var(--ink-dim); }
    #info-panel .pl-row.done .n { color: var(--gold); }
    #info-panel .pl-row.active { color: var(--crimson); }
    #info-panel .pl-row.active .n { color: var(--crimson); }
    #info-panel .plan-detail {
      border: 1px solid rgba(214, 32, 63, 0.28);
      border-radius: 10px;
      padding: 11px 13px;
      background: rgba(214, 32, 63, 0.06);
      box-shadow: 0 0 16px rgba(214, 32, 63, 0.12);
    }
    #info-panel .plan-detail strong {
      display: block;
      color: var(--crimson);
      letter-spacing: 0.12em; text-transform: uppercase;
      font-size: 11px; margin-bottom: 3px;
      text-shadow: 0 0 9px rgba(214, 32, 63, 0.4);
    }
    #info-panel .plan-detail .pd-sub {
      color: var(--ink-dim); font-size: 9px;
      letter-spacing: 0.06em; margin-bottom: 8px;
    }
    #info-panel .plan-detail p { color: var(--ink-dim); margin-bottom: 9px; }
    #info-panel .plan-detail .pd-metric {
      display: inline-block;
      color: var(--crimson);
      border: 1px solid rgba(214, 32, 63, 0.35);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 9px; letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

<nav id="tabs">
  <button class="tab" data-view="moon">Moon<span class="key">1</span></button>
  <button class="tab" data-view="solar">Solar System<span class="key">2</span></button>
  <button class="tab" data-view="mars">Mars<span class="key">3</span></button>
</nav>

<div id="hud"></div>

<div id="status"></div>
<aside id="info-panel"></aside>
<aside id="body-nav"></aside>

<div id="controls">
  <span>SPEED</span>
  <input type="range" id="speed" min="0" max="6" step="0.05" value="1">
  <span id="speedVal">1.00×</span>
</div>

<button id="mission-cta"><span class="glyph">▶</span><span class="txt">Mission Plan</span></button>
<div id="mission-bar"></div>

<div id="label-layer"></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<!-- Post-processing for the Sun's bloom glow -->
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<!-- Real Earth->Mars 2026 transfer arc, generated by generate_mission_arc.py -->
<script src="mission_arc.js"></script>
<script>
'use strict';

// Ephemeris — mirror of the Python source of truth (constants.py / data.py).
// Keep these in sync with the report engine; values are JPL/NASA J2000.0.
const EPHEMERIS = {
  EARTH_AU:        1.00000261,
  MARS_AU:         1.52371034,
  MOON_ORBIT_KM:   384400,     // MOON_ORBITAL_RADIUS
  EARTH_RADIUS_KM: 6371,       // EARTH_RADIUS
  MOON_RADIUS_KM:  1737.4,
  ISS_ALT_KM:      408,        // ISS_ALTITUDE
  // name, semi-major axis (AU), sidereal period (yr), visual radius (exaggerated), colour
  planets: [
    { name: 'Mercury', orbitAU: 0.38709927, period: 0.2408467, radius: 1.0, color: 0xaaaaaa, kind: 'rocky' },
    { name: 'Venus',   orbitAU: 0.72333566, period: 0.6151973, radius: 1.8, color: 0xddb96e, kind: 'venus' },
    { name: 'Earth',   orbitAU: 1.00000261, period: 1.0000174, radius: 1.9, color: 0x2f6ab3, kind: 'earth' },
    { name: 'Mars',    orbitAU: 1.52371034, period: 1.8808476, radius: 1.2, color: 0xb5400a, kind: 'rocky' },
    { name: 'Jupiter', orbitAU: 5.20288700, period: 11.862615, radius: 6.0, color: 0xc88b3a, kind: 'gas' },
    { name: 'Saturn',  orbitAU: 9.53667594, period: 29.447498, radius: 5.2, color: 0xe4d191, kind: 'gas', rings: true },
    { name: 'Uranus',  orbitAU: 19.1891646, period: 84.016846, radius: 3.5, color: 0x9bc4e2, kind: 'gas' },
    { name: 'Neptune', orbitAU: 30.0699228, period: 164.79132, radius: 3.3, color: 0x3e52ba, kind: 'gas' },
  ],
};

// Presentation-only data sheet for the clickable close-ups. Real-world values
// for display only — kept separate from the orbital EPHEMERIS above (which
// mirrors the Python source of truth), so the report contract is untouched.
const BODY_FACTS = {
  Sun: {
    blurb: 'The G-type main-sequence star at the heart of the system; 99.86% of its mass.',
    rows: [
      ['Type', 'G2V main-sequence'], ['Diameter', '1,391,000 km'], ['Mass', '333,000 × Earth'],
      ['Surface temp', '~5,500 °C'], ['Core temp', '~15,000,000 °C'], ['Rotation', '~25–35 days'],
      ['Planets', '8'], ['Composition', '~73% H · 25% He'],
    ],
  },
  Mercury: {
    blurb: 'The smallest planet and closest to the Sun — a cratered, airless world of extremes.',
    rows: [
      ['Diameter', '4,879 km'], ['Mass', '0.055 × Earth'], ['Distance', '0.39 AU · 57.9M km'],
      ['Orbital period', '88 days'], ['Day length', '176 Earth days'], ['Moons', '0'],
      ['Mean temp', '167 °C'], ['Gravity', '3.7 m/s²'],
    ],
  },
  Venus: {
    blurb: 'Earth’s scorching twin, wrapped in thick CO₂ cloud — the hottest planet.',
    rows: [
      ['Diameter', '12,104 km'], ['Mass', '0.815 × Earth'], ['Distance', '0.72 AU · 108.2M km'],
      ['Orbital period', '225 days'], ['Day length', '243 days (retrograde)'], ['Moons', '0'],
      ['Mean temp', '464 °C'], ['Gravity', '8.9 m/s²'],
    ],
  },
  Earth: {
    blurb: 'The only known world with life — liquid-water oceans and a protective atmosphere.',
    rows: [
      ['Diameter', '12,742 km'], ['Mass', '1.0 × Earth'], ['Distance', '1.00 AU · 149.6M km'],
      ['Orbital period', '365.25 days'], ['Day length', '24 h'], ['Moons', '1'],
      ['Mean temp', '15 °C'], ['Gravity', '9.8 m/s²'],
    ],
  },
  Mars: {
    blurb: 'The cold, rust-red desert world — target of the Starship missions in the next tab.',
    rows: [
      ['Diameter', '6,779 km'], ['Mass', '0.107 × Earth'], ['Distance', '1.52 AU · 227.9M km'],
      ['Orbital period', '687 days'], ['Day length', '24.6 h'], ['Moons', '2'],
      ['Mean temp', '−65 °C'], ['Gravity', '3.7 m/s²'],
    ],
  },
  Jupiter: {
    blurb: 'The giant of the system — a banded gas world with the centuries-old Great Red Spot.',
    rows: [
      ['Diameter', '139,820 km'], ['Mass', '317.8 × Earth'], ['Distance', '5.20 AU · 778.5M km'],
      ['Orbital period', '11.86 years'], ['Day length', '9.9 h'], ['Moons', '95'],
      ['Mean temp', '−110 °C'], ['Gravity', '24.8 m/s²'],
    ],
  },
  Saturn: {
    blurb: 'The ringed jewel — a gas giant circled by ice and rock split by the Cassini Division.',
    rows: [
      ['Diameter', '116,460 km'], ['Mass', '95.2 × Earth'], ['Distance', '9.54 AU · 1.43B km'],
      ['Orbital period', '29.45 years'], ['Day length', '10.7 h'], ['Moons', '146'],
      ['Mean temp', '−140 °C'], ['Gravity', '10.4 m/s²'],
    ],
  },
  Uranus: {
    blurb: 'An ice giant tipped on its side, rolling around the Sun at a 98° axial tilt.',
    rows: [
      ['Diameter', '50,724 km'], ['Mass', '14.5 × Earth'], ['Distance', '19.19 AU · 2.87B km'],
      ['Orbital period', '84 years'], ['Day length', '17.2 h (retrograde)'], ['Moons', '28'],
      ['Mean temp', '−195 °C'], ['Gravity', '8.7 m/s²'],
    ],
  },
  Neptune: {
    blurb: 'The windiest planet — a deep-blue ice giant with supersonic storms, farthest from the Sun.',
    rows: [
      ['Diameter', '49,244 km'], ['Mass', '17.1 × Earth'], ['Distance', '30.07 AU · 4.50B km'],
      ['Orbital period', '164.8 years'], ['Day length', '16.1 h'], ['Moons', '16'],
      ['Mean temp', '−200 °C'], ['Gravity', '11.0 m/s²'],
    ],
  },
};

// Compressed heliocentric scale so distant planets stay in frame.
const auToUnits = (au) => Math.pow(au, 0.52) * 65;

// Map a heliocentric ecliptic position [x,y,z] in AU to scene units. auToUnits is a
// nonlinear radial squash, so compress the *magnitude* and keep direction (per-component
// scaling would distort angles). Ecliptic Z (out of plane) → Three.js Y (up).
const auVecToUnits = ([x, y, z]) => {
  const r = Math.hypot(x, y, z), s = r ? auToUnits(r) / r : 0;
  return new THREE.Vector3(x * s, z * s, y * s);
};

// Earth's orbital angular velocity at 1× speed, in radians per *second* of
// wall-clock time. Other bodies scale by Kepler's third law (ω ∝ 1/period).

// Bloom post-processing
// Threshold-gated UnrealBloom: only bright pixels (Sun, flares, plumes, bright
// stars) bleed light while planets stay crisp. Scene renders through the composer.

// Deep-space backdrop — present in all views. Layered star shells (varied size,
// brightness, and colour), a tilted Milky Way band, and a few faint nebulae.
let starfield;
(function () {
  starfield = new THREE.Group();
  const _c = new THREE.Color();

  // One spherical shell of stars: `n` points on a thick shell at radius `spread`,
  // drawn at a constant pixel `size`, mostly white with a few blue/amber tints.
  const shell = (n, spread, size, bright) => {
    const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const r = spread * (0.7 + Math.random() * 0.3);
      const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
      pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
      pos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
      pos[i*3+2] = r * Math.cos(ph);
      const h = Math.random();
      _c.setHSL(h < 0.7 ? 0.6 : h < 0.85 ? 0.58 : 0.09, h < 0.7 ? 0.05 : 0.5,
                bright * (0.55 + Math.random() * 0.45));
      col[i*3] = _c.r; col[i*3+1] = _c.g; col[i*3+2] = _c.b;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    return new THREE.Points(geo, new THREE.PointsMaterial({
      size, vertexColors: true, sizeAttenuation: false, transparent: true,
    }));
  };
  starfield.add(shell(9000, 16000, 1.0, 0.7));
  starfield.add(shell(3500, 14000, 1.8, 0.9));
  starfield.add(shell(600,  12000, 3.0, 1.0));

  // Milky Way band — a dense, flattened belt of faint stars across the sky.
  const mw = 7000, mp = new Float32Array(mw * 3), mc = new Float32Array(mw * 3);
  for (let i = 0; i < mw; i++) {
    const r = 13000 * (0.8 + Math.random() * 0.2);
    const th = Math.random() * Math.PI * 2, ph = Math.PI / 2 + (Math.random() - 0.5) * 0.32;
    mp[i*3]   = r * Math.sin(ph) * Math.cos(th);
    mp[i*3+1] = r * Math.cos(ph);
    mp[i*3+2] = r * Math.sin(ph) * Math.sin(th);
    _c.setHSL(0.6, 0.15, 0.4 + Math.random() * 0.4);
    mc[i*3] = _c.r; mc[i*3+1] = _c.g; mc[i*3+2] = _c.b;
  }
  const mgeo = new THREE.BufferGeometry();
  mgeo.setAttribute('position', new THREE.BufferAttribute(mp, 3));
  mgeo.setAttribute('color', new THREE.BufferAttribute(mc, 3));
  const band = new THREE.Points(mgeo, new THREE.PointsMaterial({
    size: 1.2, vertexColors: true, sizeAttenuation: false, transparent: true, opacity: 0.8,
  }));
  band.rotation.z = 0.5;   // tilt the galactic plane off the ecliptic
  starfield.add(band);

  // Nebula clouds — a few big additive sprites in cool tints, far out.
  const softSprite = (inner, outer) => {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
    g.addColorStop(0, inner); g.addColorStop(1, outer);
    x.fillStyle = g; x.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  };
  const nebTints = [
    ['rgba(120,90,200,0.22)', 'rgba(120,90,200,0)'],
    ['rgba(40,120,200,0.20)', 'rgba(40,120,200,0)'],
    ['rgba(40,170,160,0.16)', 'rgba(40,170,160,0)'],
    ['rgba(200,80,140,0.16)', 'rgba(200,80,140,0)'],
  ];
  for (let i = 0; i < 7; i++) {
    const tint = nebTints[i % nebTints.length];
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: softSprite(tint[0], tint[1]), blending: THREE.AdditiveBlending,
      depthWrite: false, transparent: true,
    }));
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    spr.position.set(11000 * Math.sin(ph) * Math.cos(th),
                     11000 * Math.cos(ph) * 0.5,
                     11000 * Math.sin(ph) * Math.sin(th));
    spr.scale.setScalar(4000 + Math.random() * 4000);
    starfield.add(spr);
  }

  scene.add(starfield);
})();

// Build a Mission-Plan chase-camera descriptor: a close shot pinned at `offset`
// from a moving subject (`anchorFn` returns its current world position each frame),
// so the camera rides the spacecraft through a phase instead of sitting at a fixed
// wide pose. `tau` is the follow smoothing (seconds); smaller = snappier.

// Quadratic Bézier a→b bowed through control c, evaluated at t into `out`.
function qbezier(a, c, b, t, out) {
  const u = 1 - t;
  return out.set(
    u * u * a.x + 2 * u * t * c.x + t * t * b.x,
    u * u * a.y + 2 * u * t * c.y + t * t * b.y,
    u * u * a.z + 2 * u * t * c.z + t * t * b.z
  );
}

// Texture loader
// Maps load async — bodies keep their base colour until the image arrives, and a
// failed load degrades to that flat colour instead of going blank.
const TEX_CDN = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/';   // three.js r128 maps (Earth + Moon only), via jsdelivr with CORS
const PLANET_CDN = 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/';   // planetpixelemporium maps for every other body
const _texLoader = new THREE.TextureLoader();
const _maxAniso  = renderer.capabilities.getMaxAnisotropy();
function loadTexture(file) {
  return _texLoader.load(
    TEX_CDN + file,
    (tex) => { tex.anisotropy = _maxAniso; },
    undefined,
    () => console.warn('texture failed, using flat colour:', file)
  );
}

// Upgrade a material to a real photo map *after* it loads, leaving whatever map it
// already has (a procedural CanvasTexture, or a flat colour) visible until then. A
// failed load is a no-op, so bodies never go blank — same graceful path as Earth.
function swapInPhoto(material, file, opts = {}) {
  if (!file) return;
  _texLoader.load(PLANET_CDN + file,
    (tex) => { tex.anisotropy = _maxAniso; material.map = tex; material.needsUpdate = true; },
    undefined,
    () => console.warn('photo texture failed, keeping fallback:', file));
  if (opts.bump) {
    _texLoader.load(PLANET_CDN + opts.bump,
      (tex) => {
        tex.anisotropy = _maxAniso;
        material.bumpMap = tex; material.bumpScale = opts.bumpScale ?? 0.05;
        material.needsUpdate = true;
      },
      undefined, () => {});
  }
}
const EARTH_TEX = {
  map:      loadTexture('earth_atmos_2048.jpg'),
  specular: loadTexture('earth_specular_2048.jpg'),
  normal:   loadTexture('earth_normal_2048.jpg'),

// Procedural planet textures (canvas → CanvasTexture)
// The CDN only ships Earth + Moon maps, so the remaining bodies are painted:
// rocky worlds get craters + mottling, gas giants get latitudinal bands and
// storms, Venus gets a thick sulphuric haze. Built once at load (not per-frame).
function _canvasTex(draw, w = 1024, h = 512) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = _maxAniso;
  return t;
}

// Interpolate a colour across an array of [r,g,b] stops at t ∈ [0,1].
function _lerpRGB(stops, t) {
  t = Math.max(0, Math.min(0.999, t));
  const s = t * (stops.length - 1), i = Math.floor(s), f = s - i;
  const a = stops[i], b = stops[i + 1] || a;
  return `rgb(${a[0]+(b[0]-a[0])*f|0},${a[1]+(b[1]-a[1])*f|0},${a[2]+(b[2]-a[2])*f|0})`;
}

function makeRockyTexture(base, opts = {}) {
  return _canvasTex((x, w, h) => {
    x.fillStyle = base; x.fillRect(0, 0, w, h);
    // soft mottling — overlapping translucent blobs in lighter/darker tints
    const tints = opts.tints || ['rgba(255,255,255,0.06)', 'rgba(0,0,0,0.12)', 'rgba(120,90,70,0.10)'];
    for (let i = 0; i < 1100; i++) {
      x.fillStyle = tints[i % tints.length];
      x.beginPath();
      x.arc(Math.random() * w, Math.random() * h, 4 + Math.random() * 34, 0, 7);
      x.fill();
    }
    // craters — dark floor with a bright sunlit rim
    for (let i = 0; i < (opts.craters ?? 70); i++) {
      const cx = Math.random() * w, cy = h * (0.12 + Math.random() * 0.76), r = 3 + Math.random() * 16;
      x.beginPath(); x.arc(cx, cy, r, 0, 7);
      x.fillStyle = 'rgba(0,0,0,0.22)'; x.fill();
      x.beginPath(); x.arc(cx - r * 0.2, cy - r * 0.2, r * 0.8, 0, 7);
      x.strokeStyle = 'rgba(255,255,255,0.16)'; x.lineWidth = 1.5; x.stroke();
    }
    // polar ice caps (Mars)
    if (opts.ice) {
      for (const top of [true, false]) {
        const y0 = top ? 0 : h * 0.90, y1 = top ? h * 0.10 : h;
        const g = x.createLinearGradient(0, y0, 0, y1);
        g.addColorStop(top ? 0 : 1, 'rgba(255,255,255,0.85)');
        g.addColorStop(top ? 1 : 0, 'rgba(255,255,255,0)');
        x.fillStyle = g; x.fillRect(0, Math.min(y0, y1), w, Math.abs(y1 - y0));
      }
    }
  });
}

function makeGasTexture(stops, opts = {}) {
  const bands = opts.bands ?? 9, turb = opts.turbulence ?? 0.16;
  return _canvasTex((x, w, h) => {
    for (let y = 0; y < h; y++) {
      const lat = y / h;
      let v = 0.5 + 0.5 * Math.sin(lat * Math.PI * 2 * bands);
      v += turb * Math.sin(lat * Math.PI * 2 * bands * 2.7 + 1.3);
      x.fillStyle = _lerpRGB(stops, v + Math.sin(lat * 80) * 0.015);
      x.fillRect(0, y, w, 1);
    }
    // flowing streaks for turbulence
    x.globalAlpha = 0.06;
    for (let i = 0; i < 60; i++) {
      const y = Math.random() * h;
      x.strokeStyle = Math.random() < 0.5 ? '#ffffff' : '#000000';
      x.lineWidth = 1 + Math.random() * 2;
      x.beginPath(); x.moveTo(0, y);
      for (let xx = 0; xx <= w; xx += 64) x.lineTo(xx, y + Math.sin(xx * 0.02 + i) * 4);
      x.stroke();
    }
    x.globalAlpha = 1;
    // a single large storm (e.g. Jupiter's Great Red Spot)
    if (opts.spot) {
      x.save();
      x.translate(w * (opts.spotX ?? 0.68), h * (opts.spotY ?? 0.62));
      x.scale(1, 0.5);
      const r = h * (opts.spotR ?? 0.08);
      const g = x.createRadialGradient(0, 0, r * 0.2, 0, 0, r);
      g.addColorStop(0, opts.spot); g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g; x.beginPath(); x.arc(0, 0, r, 0, 7); x.fill();
      x.restore();
    }
  });
}

function makeVenusTexture() {
  return _canvasTex((x, w, h) => {
    x.fillStyle = '#c9a35e'; x.fillRect(0, 0, w, h);
    const tints = ['rgba(245,225,170,0.5)', 'rgba(200,150,80,0.4)', 'rgba(255,240,200,0.35)'];
    for (let i = 0; i < 700; i++) {
      x.fillStyle = tints[i % tints.length];
      x.beginPath();
      x.arc(Math.random() * w, Math.random() * h, 30 + Math.random() * 120, 0, 7);
      x.fill();
    }
  });
}

// The Sun's photosphere: a fiery convection field — overlapping radial-gradient
// granules (hot white-yellow cores fading into dark red), a few cooler sunspots,
// and bright plasma flecks. Random each call, so two instances differ slightly.
function makeSunTexture() {
  return _canvasTex((x, w, h) => {
    x.fillStyle = '#9c2c06'; x.fillRect(0, 0, w, h);
    // granulation cells — hot centre → transparent dark-red edge
    const hot = ['#fff4cc', '#ffe07a', '#ffab2e', '#f1690f'];
    for (let i = 0; i < 1500; i++) {
      const cx = Math.random() * w, cy = Math.random() * h, r = 7 + Math.random() * 40;
      const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, hot[i % hot.length]);
      g.addColorStop(1, 'rgba(120,30,5,0)');
      x.fillStyle = g;
      x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill();
    }
    // sunspots — cooler dark patches with a soft penumbra
    for (let i = 0; i < 14; i++) {
      const cx = Math.random() * w, cy = Math.random() * h, r = 14 + Math.random() * 42;
      const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, 'rgba(55,10,0,0.85)');
      g.addColorStop(0.6, 'rgba(120,30,5,0.45)');
      g.addColorStop(1, 'rgba(120,30,5,0)');
      x.fillStyle = g;
      x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill();
    }
    // bright plasma flecks
    x.globalAlpha = 0.5;
    for (let i = 0; i < 220; i++) {
      x.fillStyle = Math.random() < 0.5 ? '#fff6d8' : '#ffe49a';
      x.beginPath();
      x.arc(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 0, 7);
      x.fill();
    }
    x.globalAlpha = 1;
  }, 1024, 1024);
}

// Reusable mesh builders
function makeBody(radius, color, opts = {}) {
  return new THREE.Mesh(
    new THREE.SphereGeometry(radius, 48, 48),
    new THREE.MeshPhongMaterial({
      color,
      map:         opts.map         ?? null,
      specularMap: opts.specularMap ?? null,
      normalMap:   opts.normalMap   ?? null,

    })
  );
}

function makeGlow(radius, color, opacity, blending = THREE.NormalBlending) {
  return new THREE.Mesh(
    new THREE.SphereGeometry(radius, 32, 32),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.BackSide, blending })
  );
}

// Self-luminous star: photosphere map (procedural fallback), a counter-rotating
// additive shell for churning plasma, layered corona shells (white-hot → orange →
// red), and erupting limb prominences. userData exposes { core, churn, corona,
// flares } for animateSun().
function makeSun(radius) {
  const group = new THREE.Group();

  const core = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 64, 64),
    new THREE.MeshBasicMaterial({ map: SUN_TEX, color: 0xffffff })
  );
  swapInPhoto(core.material, 'sunmap.jpg');   // real photosphere over the procedural one
  group.add(core);

  const churn = new THREE.Mesh(
    new THREE.SphereGeometry(radius * 1.015, 64, 64),
    new THREE.MeshBasicMaterial({
      map: SUN_TEX_CHURN, color: 0xffd28a, transparent: true, opacity: 0.5,
      blending: THREE.AdditiveBlending, depthWrite: false,
    })
  );
  group.add(churn);

  const corona = [
    makeGlow(radius * 1.22, 0xfff0b0, 0.40, THREE.AdditiveBlending),
    makeGlow(radius * 1.6,  0xff8a1e, 0.22, THREE.AdditiveBlending),
    makeGlow(radius * 2.2,  0xff3c00, 0.10, THREE.AdditiveBlending),
  ];
  corona.forEach((c) => { c.userData.baseOpacity = c.material.opacity; group.add(c); });

  // Solar prominences — additive plasma loops anchored on the limb, apex pointing
  // radially out. Each is a half-torus; animateSun flickers it and cycles it
  // through a slow eruption envelope so flares appear to leap up and subside.
  const flares = [];
  const _y = new THREE.Vector3(0, 1, 0), _d = new THREE.Vector3();
  for (let i = 0; i < 7; i++) {
    const loopR = radius * (0.18 + Math.random() * 0.22);
    const mesh = new THREE.Mesh(
      new THREE.TorusGeometry(loopR, radius * 0.018, 10, 40, Math.PI),
      new THREE.MeshBasicMaterial({
        color: new THREE.Color().setHSL(0.06 + Math.random() * 0.03, 1, 0.55),
        transparent: true, opacity: 0.85,
        blending: THREE.AdditiveBlending, depthWrite: false,
      })
    );
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    _d.set(Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th));
    mesh.position.copy(_d).multiplyScalar(radius * 0.96);
    mesh.quaternion.setFromUnitVectors(_y, _d);   // align apex with the radial direction
    mesh.rotateY(Math.random() * Math.PI);         // random roll around the radial axis
    mesh.userData = { phase: Math.random() * Math.PI * 2, baseScale: 0.8 + Math.random() * 0.5 };
    group.add(mesh);
    flares.push(mesh);
  }

  group.userData = { core, churn, corona, flares };
  return group;
}

// Per-frame fiery motion: churn shell counter-rotates and gently wobbles, corona
// shells softly pulse, and each prominence flickers + rides a slow eruption
// envelope. Core spin is left to each view's update.
function animateSun(sunGroup, dt, speed, t) {
  const ud = sunGroup.userData, s = Math.max(speed, 0.1);
  ud.churn.rotation.y -= 0.11 * s * dt;
  ud.churn.rotation.x  = Math.sin(t * 0.25) * 0.04;
  ud.corona.forEach((c, i) => {
    const k = 0.85 + 0.15 * Math.sin(t * (1.4 + i * 0.5) + i * 2);
    c.material.opacity = c.userData.baseOpacity * k;
    c.scale.setScalar(1 + (1 - k) * 0.25);
  });
  if (ud.flares) ud.flares.forEach((f) => {
    const ph = f.userData.phase;
    const env = Math.max(0, Math.sin(t * 0.35 + ph));            // eruption envelope, off ~half the time
    f.visible = env > 0.02;
    if (!f.visible) return;
    const flick = 0.7 + 0.3 * Math.sin(t * 6 + ph * 3);          // fast plasma flicker
    f.material.opacity = 0.85 * env * flick;
    f.scale.setScalar(f.userData.baseScale * (0.6 + 0.6 * env));
  });
}

function makeOrbitRing(r, color = 0x2a3a4a, opacity = 0.7) {
  const pts = [];
  for (let i = 0; i <= 360; i++) {
    const a = (i / 360) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
  }
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity })
  );
}

// Radial ring profile: brightness + opacity as a function of distance out from
// the planet, including the dark Cassini Division and a faint inner C ring.
function makeRingTexture() {
  return _canvasTex((x, w, h) => {
    for (let i = 0; i < w; i++) {
      const t = i / w;                       // 0 = inner edge, 1 = outer edge
      let a = 0.85;
      if (t < 0.12)               a *= 0.35; // faint inner C ring
      if (t > 0.47 && t < 0.55)   a = 0.04;  // Cassini Division
      if (t > 0.96)               a *= 0.5;  // soft outer fade
      a *= 0.55 + 0.45 * Math.abs(Math.sin(t * 130));   // fine ringlets
      const lum = 195 + 45 * Math.sin(t * 28);
      x.fillStyle = `rgba(${lum|0},${lum*0.86|0},${lum*0.62|0},${a})`;
      x.fillRect(i, 0, 1, h);
    }
  }, 1024, 8);
}

function makeSaturnRings(planetR) {
  const inner = planetR * 1.3, outer = planetR * 2.6;
  const geo = new THREE.RingGeometry(inner, outer, 160, 1);
  // Remap UVs so u runs radially (inner→outer) — the default RingGeometry UVs
  // are a planar box projection, which would smear the banding texture.
  const pos = geo.attributes.position, uv = geo.attributes.uv, v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    uv.setXY(i, (v.length() - inner) / (outer - inner), 0.5);
  }
  uv.needsUpdate = true;

  const ring = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    map: makeRingTexture(), side: THREE.DoubleSide, transparent: true, depthWrite: false,
  }));
  swapInPhoto(ring.material, 'saturnringcolor.jpg');   // real ring colour over the procedural strip
  const group = new THREE.Group();
  group.add(ring);
  group.rotation.x = Math.PI / 2;   // lay flat in XZ plane
  group.rotation.z = 0.46;          // ~26° axial tilt
  return group;
}

// Textured Earth: continents/oceans (map), glossy seas only (specularMap),
// surface relief (normalMap), a drifting cloud shell, and atmosphere glow.
// Tilted 23.4°; `userData.surface` / `userData.clouds` let views spin each.
function makeEarth(radius, { clouds = true } = {}) {
  const group = new THREE.Group();
  group.rotation.z = 0.41;   // 23.4° axial tilt

  const surface = makeBody(radius, 0xffffff, {
    map: EARTH_TEX.map, specularMap: EARTH_TEX.specular, normalMap: EARTH_TEX.normal,
    shininess: 22, specular: 0x556677,
  });
  group.add(surface);
  group.add(makeGlow(radius * 1.12, 0x4a90d0, 0.18));

  let cloudMesh = null;
  if (clouds) {
    cloudMesh = new THREE.Mesh(
      new THREE.SphereGeometry(radius * 1.02, 48, 48),
      new THREE.MeshPhongMaterial({ map: EARTH_TEX.clouds, transparent: true, opacity: 0.5, depthWrite: false })
    );
    group.add(cloudMesh);
  }
  group.userData = { surface, clouds: cloudMesh };
  return group;
}

// Every starship plume registers here so animate() can flicker them in one pass.
const PLUMES = [];

// Stylized stainless Starship, fully procedural: lathe hull (tank + ogive nose),
// black windward heat-shield, fore/aft flaps, Raptor cluster, and a flickering plume
// (`userData.plume`, on only during powered phases). Nose +Y; the envelope (radius
// ~0.5, base y≈-1.55, tip y≈4.15) matches the original so choreography still lines up.
function makeStarship(scale = 1) {
  const group = new THREE.Group();
  const V = THREE.Vector2;

  // Hull silhouette (radius, height): engine skirt → tank wall → ogive nose
  const prof = [
    new V(0.00, -1.55), new V(0.32, -1.55),
    new V(0.47, -1.49), new V(0.50, -1.36),
    new V(0.50,  2.55),
  ];
  const NB = 2.55, NL = 1.60;                  // ogive base height / length
  for (let i = 1; i <= 16; i++) {              // rounded ogive nose (quarter-ellipse)
    const th = (i / 16) * Math.PI / 2;
    prof.push(new V(0.50 * Math.cos(th), NB + NL * Math.sin(th)));
  }

  // Albedo kept below the 0.82 bloom threshold so the body reads as shaded steel;
  // only the tight specular glints cross it and bleed, like sun catching the hull.
  const steel = new THREE.MeshPhongMaterial({
    color: 0x595e66, shininess: 150, specular: 0x868d96, emissive: 0x070a0d,
  });
  group.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 72), steel));

  // Black windward heat-shield: the same profile, nudged outward, swept over a
  // half turn so one face reads as the dark tiled side (the iconic two-tone).
  const tile = new THREE.MeshPhongMaterial({ color: 0x141619, shininess: 10, specular: 0x232a31 });
  const shieldProf = prof.filter((p) => p.y >= -1.36 && p.x > 0.02)
                         .map((p) => new V(p.x * 1.015 + 0.004, p.y));
  group.add(new THREE.Mesh(
    new THREE.LatheGeometry(shieldProf, 48, Math.PI * 0.5, Math.PI), tile
  ));

  // Aero flaps: a small forward pair below the nose, a larger aft pair at base
  const mkFlaps = (h, d, y, tilt) => {
    const geo = new THREE.BoxGeometry(0.08, h, d);
    for (const s of [1, -1]) {
      const f = new THREE.Mesh(geo, steel);
      f.position.set(s * 0.54, y, -0.16);   // hinged on the windward (tiled) edge
      f.rotation.z = s * 0.15;              // slight dihedral
      f.rotation.x = tilt;
      group.add(f);
    }
  };
  mkFlaps(0.85, 0.50,  2.15,  0.10);
  mkFlaps(1.25, 0.85, -0.95, -0.06);

  // Raptor cluster: nozzles tucked into the skirt (detail for close framing)
  const raptorMat = new THREE.MeshPhongMaterial({ color: 0x3a3f47, shininess: 40, specular: 0x565c64 });
  const nozzle = new THREE.ConeGeometry(0.12, 0.34, 12, 1, true);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const n = new THREE.Mesh(nozzle, raptorMat);
    n.position.set(Math.cos(a) * 0.24, -1.62, Math.sin(a) * 0.24);
    group.add(n);
  }
  const centerNozzle = new THREE.Mesh(nozzle, raptorMat);
  centerNozzle.position.y = -1.62; centerNozzle.scale.setScalar(1.15);
  group.add(centerNozzle);

  // Layered engine plume (Group): white-hot core + blue body + diffuse halo +
  // a bright throat seed that bloom turns into a flare. animatePlumes() flickers it.
  const plume = new THREE.Group();
  const cone = (rad, len, color, opacity) => {
    const m = new THREE.Mesh(
      new THREE.ConeGeometry(rad, len, 24, 1, true),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })
    );
    m.rotation.x = Math.PI;            // mouth at the engine, tapering downward
    m.position.y = -1.6 - len / 2;
    m.userData.baseOpacity = opacity;
    return m;
  };
  plume.add(cone(0.30, 2.3, 0xeaf5ff, 0.90));
  plume.add(cone(0.46, 3.1, 0x8fd2ff, 0.50));
  plume.add(cone(0.66, 4.0, 0x3f86ff, 0.22));
  const seed = new THREE.Mesh(
    new THREE.SphereGeometry(0.26, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xfdfdff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  seed.position.y = -1.58; seed.userData.baseOpacity = 0.95;
  plume.add(seed);
  plume.visible = false;
  plume.userData.phase = Math.random() * Math.PI * 2;
  group.add(plume);
  PLUMES.push(plume);

  group.scale.setScalar(scale);
  group.userData = { plume };
  return group;
}

// Flicker every powered plume in one pass: jitter length/opacity so the exhaust
// shimmers like a real throttled engine instead of sitting as a static cone.
function animatePlumes(t) {
  for (const p of PLUMES) {
    if (!p.visible) continue;
    const ph = p.userData.phase;
    const f = 0.85 + 0.12 * Math.sin(t * 23 + ph) + 0.05 * Math.sin(t * 51 + ph * 1.7);
    const w = 0.92 + (f - 0.85) * 0.5;
    p.scale.set(w, f, w);
    for (const c of p.children) {
      if (c.userData.baseOpacity != null) c.material.opacity = c.userData.baseOpacity * (0.78 + 0.22 * f);
    }
  }
}

// LabelSet: projects 3D anchors to screen-space HTML labels
class LabelSet {
  constructor() { this.items = []; }
  add(object3D, text, { offset = 16, faint = false } = {}) {
    const el = document.createElement('div');
    el.className = faint ? 'plabel faint' : 'plabel';
    el.textContent = text;
    labelLayer.appendChild(el);
    const item = { object3D, el, offset };
    this.items.push(item);
    return item;
  }
  setVisible(v) { for (const it of this.items) it.el.style.display = v ? '' : 'none'; }
  update() {
    const hw = window.innerWidth / 2, hh = window.innerHeight / 2;
    for (const it of this.items) {
      it.object3D.getWorldPosition(_proj).project(camera);
      it.el.style.left    = (_proj.x + 1) * hw + 'px';
      it.el.style.top     = (-_proj.y + 1) * hh - it.offset + 'px';
      it.el.style.opacity = _proj.z < 1 ? '1' : '0';
    }
  }
}

// Mission Plan — a guided, narrated flight sequence layered over a view.
//
// A view opts in by defining `planTitle`, `planSub`, `planPhases` (an ordered
// list of {title, sub, detail, dv, dur, cam}), and three hooks: onPlanStart(),
// onPlanStop(restoreCam), and runPhase(idx, p, dt, speed) — where `p` is the
// current phase's 0→1 progress. The director sequences the phases; missionUI
// renders the timeline bar + the stepped info-panel.
class MissionDirector {
  constructor(view) {
    this.view = view;
    this.active = false;   // sequence is playing
    this.done = false;     // finished, holding the final frame
    this.idx = 0;
    this.t = 0;            // seconds into the current phase
    this.elapsed = 0;      // mission-clock seconds since start
  }
  get phases() { return this.view.planPhases; }

  start() {
    this.active = true; this.done = false;
    this.idx = 0; this.t = 0; this.elapsed = 0;
    setStatus('');
    this.view.onPlanStart();
    missionUI.show(this);
    this._enter(0);
  }
  // User-driven exit (Esc / Exit button): glide the camera home and resume ambient.
  stop() {
    if (!this.active && !this.done) return;
    this.active = false; this.done = false;
    this.view.onPlanStop(true);
    missionUI.hide();
  }
  // Tab-switch teardown: reset state without touching the camera (the switch owns it).
  reset() {
    if (!this.active && !this.done) return;
    this.active = false; this.done = false;
    this.view.onPlanStop(false);
    missionUI.hide();
  }

  _enter(i) {
    this.idx = i; this.t = 0;
    const ph = this.phases[i];
    if (ph.cam) this.view.planCamera(ph.cam(this.view));
    missionUI.render(this);
  }

  update(dt, speed) {
    const ph = this.phases[this.idx];
    const rate = 0.55 + 0.45 * Math.min(speed, 4);   // honour the slider, with a floor
    this.t += dt * rate;
    this.elapsed += dt * rate;
    this.view.runPhase(this.idx, Math.min(this.t / ph.dur, 1), dt, speed);
    missionUI.progress(this);
    if (this.t >= ph.dur) {
      if (this.idx < this.phases.length - 1) this._enter(this.idx + 1);
      else { this.active = false; this.done = true; missionUI.finish(this); }
    }
  }
}

// Mission overlay controller: bottom timeline bar + the right info-panel
const missionBar = document.getElementById('mission-bar');
const missionCta = document.getElementById('mission-cta');
const _fmtClock = (s) => {
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
};
const missionUI = {
  show(dir) {
    missionBar.innerHTML =
      '<div class="mb-head"><span>Mission Plan</span>' +
        '<span class="phase"></span>' +
        '<span class="clock">T+ 00:00</span></div>' +
      '<div class="mb-track">' +
        dir.phases.map(() => '<div class="seg"><div class="fill"></div></div>').join('') +
      '</div>' +
      '<div class="mb-ctrls"><span class="cap"></span>' +
        '<span class="btns"><button class="mb-btn" data-act="exit">Exit ✕</button></span></div>';
    this.phaseEl = missionBar.querySelector('.phase');
    this.clockEl = missionBar.querySelector('.clock');
    this.capEl   = missionBar.querySelector('.cap');
    this.segs    = [...missionBar.querySelectorAll('.seg')];
    missionBar.querySelector('[data-act="exit"]').onclick = () => dir.stop();
    missionBar.classList.add('on');
    missionCta.classList.add('running');
    missionCta.querySelector('.txt').textContent = 'Mission Running';
  },
  render(dir) {
    const ph = dir.phases[dir.idx], i = dir.idx, n = dir.phases.length;
    this.phaseEl.textContent = `${i + 1} / ${n} · ${ph.title}`;
    this.capEl.textContent = ph.sub || '';
    this.segs.forEach((s, k) => {
      s.classList.toggle('active', k === i);
      s.classList.toggle('done', k < i);
      if (k > i) s.querySelector('.fill').style.width = '0%';
    });
    setPanel(this._panelHTML(dir));
  },
  progress(dir) {
    const p = Math.min(dir.t / dir.phases[dir.idx].dur, 1);
    this.segs[dir.idx].querySelector('.fill').style.width = (p * 100).toFixed(1) + '%';
    this.clockEl.textContent = 'T+ ' + _fmtClock(dir.elapsed);
  },
  finish(dir) {
    this.phaseEl.textContent = 'Sequence complete';
    missionBar.querySelector('.mb-ctrls').innerHTML =
      '<span class="cap">Mission complete</span>' +
      '<span class="btns"><button class="mb-btn" data-act="replay">↺ Replay</button>' +
      '<button class="mb-btn" data-act="exit">Exit ✕</button></span>';
    missionBar.querySelector('[data-act="replay"]').onclick = () => dir.start();
    missionBar.querySelector('[data-act="exit"]').onclick = () => dir.stop();
    missionCta.classList.remove('running');
    missionCta.querySelector('.txt').textContent = 'Replay Mission';
  },
  hide() {
    missionBar.classList.remove('on');
    missionBar.innerHTML = '';
    missionCta.classList.remove('running');
    missionCta.querySelector('.txt').textContent = 'Mission Plan';
    setPanel('');
  },
  _panelHTML(dir) {
    const i = dir.idx, ph = dir.phases[i];
    const list = dir.phases.map((p, k) =>
      `<div class="pl-row ${k === i ? 'active' : k < i ? 'done' : ''}">` +
        `<span class="n">${k < i ? '✓' : k + 1}</span>` +
        `<span class="nm">${p.title}</span></div>`
    ).join('');
    return (
      `<h4>${dir.view.planTitle}</h4>` +
      `<div class="sub">${dir.view.planSub}</div>` +
      `<div class="plan-list">${list}</div>` +
      '<div class="plan-detail">' +
        `<strong>${ph.title}</strong>` +
        `<div class="pd-sub">${ph.sub || ''}</div>` +
        `<p>${ph.detail || ''}</p>` +
        (ph.dv ? `<span class="pd-metric">${ph.dv}</span>` : '') +
      '</div>'
    );
  },
};

// View base — each tab is a self-contained scene graph under one root group.
class View {
  constructor() {
    this.root = new THREE.Group();
    this.root.visible = false;
    scene.add(this.root);
    this.labels = new LabelSet();
    this.built  = false;
    this.hud    = '';
    this.pose   = { pos: new THREE.Vector3(0, 220, 520), target: new THREE.Vector3(), min: 20, max: 5000 };
  }
  ensureBuilt() { if (!this.built) { this.build(); this.built = true; } }
  activate()    { this.ensureBuilt(); this.root.visible = true;  this.labels.setVisible(true); }
  deactivate()  { this.root.visible = false; this.labels.setVisible(false); }
  build()  {}            // create geometry into this.root + register labels
  update() {}            // (dt, speed) per-frame motion
}

// 1. Solar System (home / default)
class SolarView extends View {
  constructor() {
    super();
    this.pose = { pos: new THREE.Vector3(0, 220, 520), target: new THREE.Vector3(), min: 20, max: 5000 };
    this.hud =
      '<strong>SOLAR SYSTEM</strong>' +
      'Eight planets · J2000.0 elements<br>' +
      'Speeds: Kepler\'s third law (T ∝ a<sup>3/2</sup>)<br>' +
      'Distances: compressed scale (AU<sup>0.52</sup>)<br>' +
      'Click a body to zoom in · drag · scroll to navigate';
    this.focusable = [];     // meshes the raycaster can pick (planets + Sun)
    this.focused   = null;   // { mesh, name, radius } while a body is framed
    this.focusByNameMap = {}; // name → focus info, for the top-right picker box
  }
  build() {
    this.root.add(new THREE.PointLight(0xfff4cc, 2.6, 6000, 1.0));

    const SUN_R = 14;
    this.sunGroup = makeSun(SUN_R);
    this.sun = this.sunGroup.userData.core;
    this.root.add(this.sunGroup);
    this.labels.add(this.sun, 'Sun', { offset: SUN_R + 10 });
    this.sun.userData.focus = { mesh: this.sun, name: 'Sun', radius: SUN_R };
    this.focusByNameMap['Sun'] = this.sun.userData.focus;
    this.focusable.push(this.sun);

    this.planets = EPHEMERIS.planets.map((d) => {
      const orbitR = auToUnits(d.orbitAU);
      this.root.add(makeOrbitRing(orbitR));

      const gas = d.kind === 'gas';
      const mesh = d.name === 'Earth'
        ? makeBody(d.radius, 0xffffff, {
            map: EARTH_TEX.map, specularMap: EARTH_TEX.specular, normalMap: EARTH_TEX.normal,
            shininess: 22, specular: 0x556677,
          })
        : makeBody(d.radius, 0xffffff, {
            map: PLANET_TEX[d.name], shininess: gas ? 30 : 6, specular: gas ? 0x201810 : 0x0a0a0a,
          });
      if (d.name !== 'Earth' && PLANET_PHOTO[d.name]) swapInPhoto(mesh.material, PLANET_PHOTO[d.name].map, PLANET_PHOTO[d.name]);
      if (ATMO[d.name]) mesh.add(makeGlow(d.radius * (gas ? 1.10 : 1.06), ATMO[d.name], gas ? 0.16 : 0.12));
      mesh.position.x = orbitR;
      if (d.rings) mesh.add(makeSaturnRings(d.radius));

      const pivot = new THREE.Object3D();
      pivot.rotation.y = Math.random() * Math.PI * 2;
      pivot.add(mesh);
      this.root.add(pivot);

      this.labels.add(mesh, d.name, { offset: d.radius * 2 + 6, faint: true });
      mesh.userData.focus = { mesh, name: d.name, radius: d.radius };
      this.focusByNameMap[d.name] = mesh.userData.focus;
      this.focusable.push(mesh);
      return { mesh, pivot, period: d.period };
    });
  }
  update(dt, speed) {
    animateSun(this.sunGroup, dt, speed, clock.getElapsedTime());
    if (this.focused) {
      // Orbits frozen so the framed body holds still; keep a gentle axial spin
      // (independent of the speed slider) for the slow 360 reveal.
      this.focused.mesh.rotation.y += 0.25 * dt;
      return;
    }
    for (const p of this.planets) {
      p.pivot.rotation.y += (EARTH_OMEGA / p.period) * speed * dt;
      p.mesh.rotation.y  += 0.4 * speed * dt;
    }
    this.sun.rotation.y += 0.06 * Math.max(speed, 0.1) * dt;
  }

  // Picker-box entry → frame that body (same path as clicking it on screen).
  focusByName(name) {
    this.ensureBuilt();
    const info = this.focusByNameMap[name];
    if (info) this.focusOn(info);
  }

  // Click-to-focus: frame one body for a slow turntable close-up
  focusOn(info) {
    this.focused = info;
    this.labels.setVisible(false);   // declutter — the panel names the body
    bodyNav.setActive(info.name);    // light up the matching picker entry

    const target = info.mesh.getWorldPosition(new THREE.Vector3());
    const dir = new THREE.Vector3(0.6, 0.35, 1).normalize();
    const dist = info.radius * 5 + 12;
    const pos = target.clone().add(dir.multiplyScalar(dist));
    manager.focusCamera(pos, target, info.radius * 2, info.radius * 40);

    bodyNav.setDetail(this._renderBodyPanel(info.name));   // dock the sheet under the picker
  }
  exitFocus() {
    if (!this.focused) return;
    this.focused = null;
    this.labels.setVisible(true);
    bodyNav.setActive(null);    // clear the picker highlight
    bodyNav.clearDetail();      // collapse the rail back to just the list
    manager.unfocusCamera(this.pose);
  }
  deactivate() {
    super.deactivate();
    if (this.focused) { this.focused = null; controls.autoRotate = false; }
    bodyNav.setActive(null);
    bodyNav.clearDetail();   // leaving the tab — reset the rail to just the list
  }

  _renderBodyPanel(name) {
    const f = BODY_FACTS[name];
    if (!f) return '';
    return (
      `<h4>${name.toUpperCase()}</h4>` +
      `<div class="blurb">${f.blurb}</div>` +
      '<div class="sheet">' +
      f.rows.map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('') +
      '</div>' +
      '<div class="hint">Esc · click empty space to exit</div>'
    );
  }
}

// 2. Earth–Moon system
class EarthMoonView extends View {
  constructor() {
    super();
    this.pose = { pos: new THREE.Vector3(0, 60, 200), target: new THREE.Vector3(), min: 30, max: 900 };
    this.hud =
      '<strong>EARTH · MOON</strong>' +
      'Mean distance <span class="accent">384,400 km</span> (60 Earth-radii)<br>' +

  deactivate() { super.deactivate(); this.director.reset(); }   // never leave a plan running across tabs

  // Quadratic Bézier helper for the trans-lunar arc.
  static _bezier(a, c, b, t, out) {
    const u = 1 - t;
    return out.set(
      u * u * a.x + 2 * u * t * c.x + t * t * b.x,
      u * u * a.y + 2 * u * t * c.y + t * t * b.y,
      u * u * a.z + 2 * u * t * c.z + t * t * b.z
    );
  }

  update(dt, speed) {
    // Spins that read well in every mode (surface, tidal lock, ISS).
    this.earth.userData.surface.rotation.y += 0.5 * speed * dt;
    if (this.earth.userData.clouds) this.earth.userData.clouds.rotation.y += 0.62 * speed * dt;
    this.moon.rotation.y      += 0.45 * speed * dt;   // tidally-locked spin
    this.basePin.rotation.y   += 1.2 * dt;
    this.issPivot.rotation.y  += 2.4 * speed * dt;

    if (this.director.active) { this.director.update(dt, speed); return; }
    if (this.director.done)   return;   // hold the landed frame until Replay/Exit

    this.moonPivot.rotation.y += 0.45 * speed * dt;   // ambient lunar revolution
    this._mission(dt, speed);
  }

  // World position of the Moon (frozen at rotation 0 during a plan, so framing is stable).
  moonWorld(out = new THREE.Vector3()) { return this.moon.getWorldPosition(out); }

  // A point on the tilted low-Earth parking orbit at angle `a`.
  _leoPoint(a, out = new THREE.Vector3()) {
    out.set(Math.cos(a) * this.leoOrbit, 0, Math.sin(a) * this.leoOrbit);
    return out.applyAxisAngle(_XAXIS, 0.5);
  }

  onPlanStart() {
    this._leoA = -0.4;                  // ascent insertion angle
    this.moonPivot.rotation.y = 0;      // freeze the Moon for predictable framing
    // The plan positions the ship/tanker in world space, so flatten their pivots.
    this.shipPivot.rotation.set(0, 0, 0);   this.shipPivot.position.set(0, 0, 0);
    this.tankerPivot.rotation.set(0, 0, 0); this.tankerPivot.position.set(0, 0, 0);
  }
  onPlanStop(restoreCam) {
    this.ship.scale.setScalar(1);
    this.ship.rotation.set(0, 0, Math.PI / 2);
    this.tanker.visible = true;
    this.fuelLink.visible = false;
    this.missionT = 0;                  // ambient loop restarts cleanly
    manager.stopChase();
    if (restoreCam) manager.cineGlide(this.pose.pos, this.pose.target, this.pose);
  }
  // Live world position of the Starship — the subject the chase camera tracks.
  shipWorld() { return this.ship.getWorldPosition(_camAnchor); }
  planCamera(cam) {
    if (cam.track) manager.startChase(cam);
    else manager.cineGlide(cam.pos, cam.target, cam);
  }

  // Drive the ship/tanker for phase `idx`, with phase progress `p` in [0,1].
  runPhase(idx, p) {
    const ship = this.ship, plume = ship.userData.plume;
    this.tanker.visible = false;
    this.fuelLink.visible = false;
    plume.visible = false;

    if (idx === 0) {                    // Liftoff — gravity turn into LEO
      const surf = this._leoPoint(this._leoA, _v0).setLength(this.earthR * 1.01);
      const leo  = this._leoPoint(this._leoA, _v1);
      const ctrl = _v2.copy(surf).lerp(leo, 0.5).multiplyScalar(1.2);
      const k = _easeInOut(p);
      qbezier(surf, ctrl, leo, k, ship.position);
      qbezier(surf, ctrl, leo, Math.min(k + 0.02, 1), _v3);
      ship.lookAt(_v3); ship.rotateX(Math.PI / 2);
      plume.visible = true;

    } else if (idx === 1) {             // Parking orbit coast
      const a = this._leoA + p * Math.PI * 1.2;
      this._leoPoint(a, ship.position);
      this._leoPoint(a + 0.02, _v3);
      ship.lookAt(_v3); ship.rotateX(Math.PI / 2);
      this._parkA = a;

    } else if (idx === 2) {             // Orbital refueling — tanker docks
      const a = this._parkA;
      this._leoPoint(a, ship.position);
      this._leoPoint(a + 0.02, _v3);
      ship.lookAt(_v3); ship.rotateX(Math.PI / 2);

      this.tanker.visible = true;
      const dock = _easeInOut(Math.min(p * 1.6, 1));
      const slot = this._leoPoint(a, _v0);
      const start = _v1.copy(slot).multiplyScalar(0.8); start.y -= 9;
      const docked = _v2.copy(slot).add(_v3.set(0, -3.2, 0));
      this.tanker.position.copy(start).lerp(docked, dock);
      this.tanker.rotation.copy(ship.rotation);
      if (dock > 0.9) {
        this.fuelLink.visible = true;
        ship.getWorldPosition(_v0);
        this.tanker.getWorldPosition(_v1);
        this.fuelLink.position.copy(_v0).lerp(_v1, 0.5);
        this.fuelLink.scale.y = _v0.distanceTo(_v1);
        this.fuelLink.quaternion.setFromUnitVectors(_YAXIS, _v2.subVectors(_v1, _v0).normalize());
      }

    } else if (idx === 3 || idx === 4) {   // TLI burn + translunar coast (one arc)
      const depart = this._leoPoint(this._parkA, _v0);
      const moon = this.moonWorld(_v1);
      const ctrl = _v2.copy(depart).add(moon).multiplyScalar(0.5); ctrl.y += 50;
      const b = idx === 3 ? p * 0.45 : 0.45 + p * 0.4;   // coast ends at 0.85
      qbezier(depart, ctrl, moon, b, ship.position);
      qbezier(depart, ctrl, moon, Math.min(b + 0.02, 1), _v3);
      ship.lookAt(_v3); ship.rotateX(Math.PI / 2);
      plume.visible = (idx === 3);       // burn only during the injection
      this._tliDepart = depart.clone();
      this._tliCtrl = ctrl.clone();

    } else {                            // Lunar landing — approach then propulsive descent
      const moon = this.moonWorld(_v1);
      if (p < 0.4) {
        const b = 0.85 + (p / 0.4) * 0.15;
        qbezier(this._tliDepart, this._tliCtrl, moon, b, ship.position);
        qbezier(this._tliDepart, this._tliCtrl, moon, Math.min(b + 0.02, 1), _v3);
        ship.lookAt(_v3); ship.rotateX(Math.PI / 2);
        plume.visible = true;
      } else {

        const hover = _v0.copy(moon).add(_v2.set(0, this.moonR + 22, 0));
        const land  = _v1.copy(moon).add(_v3.set(0, this.moonR + 1.6, 0));
        ship.position.copy(hover).lerp(land, k);
        ship.rotation.set(0, 0, 0);      // upright on the surface
        plume.visible = k < 0.96;        // retro burn until touchdown
      }
    }
  }

  // Four-phase narrative loop: LEO orbit → orbital refuel → trans-lunar
  // injection → lunar arrival, then repeat. `missionT` runs 0→1.
  _mission(dt, speed) {
    this.missionT = (this.missionT + 0.04 * speed * dt) % 1;
    const t = this.missionT;
    const plume = this.ship.userData.plume;

    // Default LEO positions: ship and tanker on opposite sides of the parking ring.
    this.shipPivot.rotation.y   += 1.4 * speed * dt;
    this.shipPivot.rotation.x    = 0.5;
    this.ship.position.set(this.leoOrbit, 0, 0);
    this.tankerPivot.rotation.copy(this.shipPivot.rotation);
    this.tanker.position.set(this.leoOrbit, 0, 0);
    plume.visible = false;
    this.fuelLink.visible = false;
    this.ship.rotation.set(0, 0, Math.PI / 2);   // lie tangent to the orbit

    if (t < 0.25) {
      setStatus('Mission · <span class="accent">LEO Parking Orbit</span>');
    } else if (t < 0.5) {
      // Refuel: tanker closes in from a slightly lower orbit and docks.
      const k = (t - 0.25) / 0.25;
      this.tanker.position.set(this.leoOrbit - 6 * (1 - k), -3 * (1 - k), 0);
      this.fuelLink.visible = true;
      this.ship.getWorldPosition(_v0);
      this.tanker.getWorldPosition(_v1);
      this.fuelLink.position.copy(_v0).lerp(_v1, 0.5);
      this.fuelLink.scale.y = _v0.distanceTo(_v1);
      this.fuelLink.quaternion.setFromUnitVectors(_YAXIS, _v2.subVectors(_v1, _v0).normalize());
      setStatus('Mission · <span class="accent">Orbital Refueling</span> · tanker docked');
    } else if (t < 0.85) {
      // Trans-lunar injection: leave LEO on a Bézier arc to the Moon's
      // current position. Ship rides this.root frame directly (detached look).
      const k = (t - 0.5) / 0.35;
      this.shipPivot.rotation.set(0, 0, 0);   // freeze the pivot; drive position
      const depart = _v0.set(this.leoOrbit, 0, 0);
      const moonPos = this.moon.getWorldPosition(_v1);
      const ctrl = _v2.copy(depart).add(moonPos).multiplyScalar(0.5);
      ctrl.y += 40;   // bow the arc up out of the orbital plane
      EarthMoonView._bezier(depart, ctrl, moonPos, k, this.ship.position);
      // Point the nose along the path (sample slightly ahead).
      EarthMoonView._bezier(depart, ctrl, moonPos, Math.min(k + 0.02, 1), _v3);
      this.ship.lookAt(_v3);
      this.ship.rotateX(Math.PI / 2);   // model nose is +Y; align to lookAt's −Z
      plume.visible = true;
      setStatus('Mission · <span class="accent">Trans-Lunar Injection</span> · Δv 3.08 km/s');
    } else {
      // Arrival: hold near the Moon.
      this.shipPivot.rotation.set(0, 0, 0);
      this.moon.getWorldPosition(this.ship.position);
      this.ship.position.y += 6;
      this.ship.rotation.set(0, 0, 0);
      setStatus('Mission · <span class="accent">Lunar Arrival</span> · Δv 0.83 km/s');
    }
  }
}
