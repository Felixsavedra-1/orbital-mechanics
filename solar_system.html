  moonWorldMars(out = new THREE.Vector3()) { return this.moon.getWorldPosition(out); }

  // A point on a small tilted parking orbit around Earth's fixed departure position.
  _leoPointMars(a, out = new THREE.Vector3()) {
    out.set(Math.cos(a) * 9, 0, Math.sin(a) * 9).applyAxisAngle(_XAXIS, 0.4);
    return out.add(this.E);
  }

  // Place every body for a heliocentric progress value (shared by the arc & the plan).
  _placeFlight(prog) {
    const last = this.craftPts.length - 1;
    const f = Math.max(0, Math.min(prog, 1)) * last;
    const i = Math.min(Math.floor(f), last - 1);
    const lerp = (pts) => pts[i].clone().lerp(pts[i + 1], f - i);
    this.earth.position.copy(lerp(this.earthPts));
    this.moonPivot.position.copy(this.earth.position);
    this.mars.position.copy(lerp(this.marsPts));
    this.craft.position.copy(lerp(this.craftPts));
    this.craft.lookAt(this.craftPts[Math.min(i + 1, last)]);
    this.craft.rotateX(Math.PI / 2);
  }

  // Side-panel content; the active step lights up as the craft advances.
  _renderPanel(active) {
    const m = MISSION_ARC.meta;
    const steps = [
      ['Departure', 'Trans-Mars Injection', 'Refueled in LEO; Raptor burn onto the transfer arc.', `v∞ ${m.v_inf_depart_km_s.toFixed(2)} km/s · C3 ${m.c3_km2_s2.toFixed(1)}`],
      ['Cruise', `~${m.tof_days.toFixed(0)}-day coast`, 'Ballistic Lambert arc, Sun-relative. Engines off the whole way.', ''],
      ['Arrival', 'Mars Orbit Insertion', 'Aerocapture / retro-burn into Mars orbit.', `v∞ ${m.v_inf_arrive_km_s.toFixed(2)} km/s · total ${m.total_v_inf_km_s.toFixed(2)}`],
    ];
    setPanel(
      '<h4>EARTH → MARS</h4><div class="sub">Starship · real 2026 Lambert solution</div>' +
      steps.map(([t, s, d, dv], i) =>
        `<div class="step${i === active ? ' active' : ''}">` +
        `<strong>● ${t}</strong>${s}<br>${d}` +
        (dv ? `<br><span class="dv">${dv}</span>` : '') +
        '</div>'
      ).join('')
    );
  }

  update(dt, speed) {
    animateSun(this.sunGroup, dt, speed, clock.getElapsedTime());
    this.sun.rotation.y                += 0.05 * Math.max(speed, 0.1) * dt;
    this.earth.userData.surface.rotation.y += 0.4 * speed * dt;
    this.mars.rotation.y               += 0.4 * speed * dt;

    if (this.director.active) { this.director.update(dt, speed); return; }
    if (this.director.done)   return;   // hold the arrival frame until Replay/Exit

    this.moonPivot.rotation.y += 0.6 * speed * dt;
    this.progress = (this.progress + 0.06 * speed * dt) % 1;
    this._placeFlight(this.progress);
    this.craft.userData.plume.visible = this.progress < 0.2;   // departure burn

    const active = this.progress < 0.15 ? 0 : this.progress < 0.85 ? 1 : 2;
    if (active !== this.activeStep) { this.activeStep = active; this._renderPanel(active); }
  }

  onPlanStart() {
    this.moonPivot.rotation.y = 0;                 // freeze the Moon for framing
    this.moonPivot.position.copy(this.E);
    this.earth.position.copy(this.E);
    this.mars.position.copy(this.marsPts[0]);
    this.craft.scale.setScalar(0.5);
    this.progress = 0;
  }
  onPlanStop(restoreCam) {
    this.craft.scale.setScalar(this.craftScale);
    this.tanker.visible = false;
    this.fuelLink.visible = false;
    this.activeStep = -1;                          // ambient panel rebuilds
    manager.stopChase();
    if (restoreCam) manager.cineGlide(this.pose.pos, this.pose.target, this.pose);
  }
  // Live world position of the Starship — the subject the chase camera tracks.
  craftWorld() { return this.craft.getWorldPosition(_camAnchor); }
  planCamera(cam) {
    if (cam.track) manager.startChase(cam);
    else manager.cineGlide(cam.pos, cam.target, cam);
  }

  runPhase(idx, p) {
    const craft = this.craft, plume = craft.userData.plume;
    this.tanker.visible = false;
    this.fuelLink.visible = false;
    plume.visible = false;

    if (idx <= 3) {                     // Local staging around Earth/Moon
      craft.scale.setScalar(0.5);

      if (idx === 0) {                  // Ascent to LEO
        const surf = this._leoPointMars(-0.4, _v0);
        _v1.copy(surf).sub(this.E).setLength(this.marsEarthR * 1.05).add(this.E);  // surface pt
        const leo = this._leoPointMars(-0.4, _v2);
        const ctrl = _v3.copy(_v1).lerp(leo, 0.5).sub(this.E).multiplyScalar(1.25).add(this.E);
        const k = _easeInOut(p);
        qbezier(_v1, ctrl, leo, k, craft.position);
        qbezier(_v1, ctrl, leo, Math.min(k + 0.02, 1), _v0);
        craft.lookAt(_v0); craft.rotateX(Math.PI / 2);
        plume.visible = true;
        this._parkAMars = -0.4;

      } else if (idx === 1) {           // Orbital refueling near Earth
        const a = this._parkAMars;
        this._leoPointMars(a, craft.position);
        this._leoPointMars(a + 0.02, _v0);
        craft.lookAt(_v0); craft.rotateX(Math.PI / 2);
        this.tanker.visible = true;
        const dock = _easeInOut(Math.min(p * 1.6, 1));
        const slot = this._leoPointMars(a, _v1);
        const start = _v2.copy(slot).sub(this.E).multiplyScalar(0.78).add(this.E); start.y -= 6;
        const docked = _v3.copy(slot).add(_v0.set(0, -1.8, 0));
        this.tanker.position.copy(start).lerp(docked, dock);
        this.tanker.rotation.copy(craft.rotation);
        if (dock > 0.9) {
          this.fuelLink.visible = true;
          craft.getWorldPosition(_v0);
          this.tanker.getWorldPosition(_v1);
          this.fuelLink.position.copy(_v0).lerp(_v1, 0.5);
          this.fuelLink.scale.y = _v0.distanceTo(_v1);
          this.fuelLink.quaternion.setFromUnitVectors(_YAXIS, _v2.subVectors(_v1, _v0).normalize());
        }

      } else if (idx === 2) {           // Transit to the Moon + landing
        const depart = this._leoPointMars(this._parkAMars, _v0);
        const moon = this.moonWorldMars(_v1);
        const ctrl = _v2.copy(depart).add(moon).multiplyScalar(0.5); ctrl.y += 9;
        if (p < 0.7) {
          const b = (p / 0.7);
          qbezier(depart, ctrl, moon, b, craft.position);
          qbezier(depart, ctrl, moon, Math.min(b + 0.02, 1), _v3);
          craft.lookAt(_v3); craft.rotateX(Math.PI / 2);
          plume.visible = b < 0.25;
        } else {
          const k = _easeInOut((p - 0.7) / 0.3);
          const hover = _v0.copy(moon).add(_v2.set(0, this.moonRMars + 7, 0));
          const land  = _v1.copy(moon).add(_v3.set(0, this.moonRMars + 1.2, 0));
          craft.position.copy(hover).lerp(land, k);
          craft.rotation.set(0, 0, 0);
          plume.visible = true;
        }
        this._marsDepartPt = this.moonWorldMars(new THREE.Vector3()).add(new THREE.Vector3(0, this.moonRMars + 1.2, 0));

      } else {                          // idx 3 — Lunar departure / lift-off
        const moon = this.moonWorldMars(_v1);
        const start = _v0.copy(moon).add(_v2.set(0, this.moonRMars + 1.2, 0));
        const end = _v3.copy(this.craftPts[0]);   // head toward the TMI point
        const k = _easeInOut(p);
        craft.position.copy(start).lerp(end, k);
        craft.lookAt(end); craft.rotateX(Math.PI / 2);
        plume.visible = true;
      }

    } else {                            // Heliocentric flight on the real arc
      craft.scale.setScalar(this.craftScale);
      let prog;
      if (idx === 4) {                  // Trans-Mars Injection
        prog = 0;
        this._placeFlight(0);
        // ease the craft from its lunar-departure point onto the arc start
        const k = _easeInOut(p);
        const from = this._marsDepartPt || this.craftPts[0];
        craft.position.copy(from).lerp(this.craftPts[0], k);
        craft.lookAt(this.craftPts[1]); craft.rotateX(Math.PI / 2);
        plume.visible = true;
        return;
      } else if (idx === 5) {           // Cruise
        prog = p * 0.92;
        plume.visible = p < 0.08;       // brief trim, then coast
      } else {                          // idx 6 — Mars Orbit Insertion
        prog = 0.92 + p * 0.08;
        plume.visible = p > 0.55;       // retro / capture burn
      }
      this._placeFlight(prog);
      this.progress = prog;
    }
  }
}

// View manager — tab switching with eased camera framing.
const ORDER = ['moon', 'solar', 'mars'];
const views = { moon: new EarthMoonView(), solar: new SolarView(), mars: new MarsView() };
const hudEl = document.getElementById('hud');
const tabEls = [...document.querySelectorAll('.tab')];

const manager = {
  activeId: null,
  ease: null,
  _tgt:  new THREE.Vector3(),

  switchTo(id, instant = false) {
    if (id === this.activeId) return;
    const next = views[id];
    if (this.activeId) views[this.activeId].deactivate();
    next.activate();
    this.activeId = id;

    hudEl.innerHTML = next.hud;
    setStatus('');   // views opt back in via their update()
    setPanel('');
    controls.autoRotate = false;   // never carry a close-up turntable across tabs
    bodyNav.show(id === 'solar');   // picker box is a Solar-System-only affordance
    bodyNav.setActive(null);
    missionUI.hide();               // drop any leftover plan overlay
    this.chase = null;              // never carry a chase camera across tabs
    missionCta.style.display = next.director ? 'inline-flex' : 'none';
    for (const t of tabEls) t.classList.toggle('active', t.dataset.view === id);
    controls.minDistance = next.pose.min;
    controls.maxDistance = next.pose.max;

    if (instant) {
      camera.position.copy(next.pose.pos);
      controls.target.copy(next.pose.target);
    } else {
      this.ease = { fromPos: camera.position.clone(), toPos: next.pose.pos.clone(),
                    fromTgt: controls.target.clone(), toTgt: next.pose.target.clone(),
                    t: 0, dur: 0.55 };
    }
  },

  // Ease the camera in to frame a single body, then hand off to the OrbitControls
  // turntable (slow auto-rotate) once the transition lands.
  focusCamera(pos, target, min, max) {
    controls.autoRotate = false;   // off during the glide, on once we arrive
    this._focusPending = true;
    this.chase = null;
    controls.minDistance = min;
    controls.maxDistance = max;
    this.ease = { fromPos: camera.position.clone(), toPos: pos.clone(),
                  fromTgt: controls.target.clone(), toTgt: target.clone(),
                  t: 0, dur: 0.7 };
  },
  // One-shot cinematic glide (no turntable, no restore) — used by Mission Plan phases.
  cineGlide(pos, target, { min, max, dur = 1.0 } = {}) {
    controls.autoRotate = false;
    this._focusPending = false;
    this.chase = null;
    if (min != null) controls.minDistance = min;
    if (max != null) controls.maxDistance = max;
    this.ease = { fromPos: camera.position.clone(), toPos: pos.clone(),
                  fromTgt: controls.target.clone(), toTgt: target.clone(), t: 0, dur };
  },
  // Close tracking shot for a Mission Plan phase: smoothly follow a moving subject
  // (anchorFn → world position) held at a fixed offset. Re-framing between phases is
  // continuous — we just swap the anchor/offset and let update() ease the camera over.
  startChase({ track, offset, min, max, tau }) {
    controls.autoRotate = false;
    this._focusPending = false;
    this.ease = null;                        // a chase takes over from any glide
    if (min != null) controls.minDistance = min;
    if (max != null) controls.maxDistance = max;
    this.chase = { anchor: track, offset, tau: tau || 0.65 };
  },
  stopChase() { this.chase = null; },
  // Ease back out to the view's default framing and stop the turntable.
  unfocusCamera(pose) {
    controls.autoRotate = false;
    this._focusPending = false;
    this.chase = null;
    this.ease = { fromPos: camera.position.clone(), toPos: pose.pos.clone(),
                  fromTgt: controls.target.clone(), toTgt: pose.target.clone(),
                  t: 0, dur: 0.6, restore: pose };
  },

  update(dt, speed) {
    if (this.ease) {
      this.ease.t += dt / this.ease.dur;
      const k = Math.min(this.ease.t, 1);
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;   // easeInOutQuad
      camera.position.lerpVectors(this.ease.fromPos, this.ease.toPos, e);
      this._tgt.lerpVectors(this.ease.fromTgt, this.ease.toTgt, e);
      controls.target.copy(this._tgt);
      camera.lookAt(this._tgt);
      if (k >= 1) {
        const done = this.ease;
        this.ease = null;
        if (done.restore) { controls.minDistance = done.restore.min; controls.maxDistance = done.restore.max; }
        if (this._focusPending) { controls.autoRotate = true; controls.autoRotateSpeed = 0.8; this._focusPending = false; }
      }
    } else if (this.chase) {
      // Follow the live subject at a fixed offset, easing both eye and target so the
      // camera trails the spacecraft smoothly (frame-rate-independent smoothing).
      const c = this.chase;
      this._tgt.copy(c.anchor());
      _chaseV.copy(this._tgt).add(c.offset);
      const a = 1 - Math.exp(-dt / c.tau);
      camera.position.lerp(_chaseV, a);
      controls.target.lerp(this._tgt, a);
      camera.lookAt(controls.target);
    } else {
      controls.update();
    }
    views[this.activeId].update(dt, speed);
    views[this.activeId].labels.update();
  },
};

// Tab + keyboard wiring
tabEls.forEach((t) => t.addEventListener('click', () => manager.switchTo(t.dataset.view)));
window.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') {
    const v = views[manager.activeId];
    if (v && v.director && (v.director.active || v.director.done)) { v.director.stop(); return; }
    views.solar.exitFocus();
    return;
  }
  if (ev.key >= '1' && ev.key <= '3') manager.switchTo(ORDER[+ev.key - 1]);
  else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
    const i = ORDER.indexOf(manager.activeId);
    const d = ev.key === 'ArrowRight' ? 1 : -1;
    manager.switchTo(ORDER[(i + d + ORDER.length) % ORDER.length]);
  }
});

// Click-to-focus: pick a planet/Sun in the Solar System view
// A raycaster turns pointer taps into body selections. We distinguish a click
// from an OrbitControls drag by measuring pointer travel between down and up.
const _ray = new THREE.Raycaster();
const _ptr = new THREE.Vector2();
const _down = { x: 0, y: 0 };
const canvas = renderer.domElement;

function _pickFocus(ev) {
  _ptr.x = (ev.clientX / window.innerWidth) * 2 - 1;
  _ptr.y = -(ev.clientY / window.innerHeight) * 2 + 1;
  _ray.setFromCamera(_ptr, camera);
  const hits = _ray.intersectObjects(views.solar.focusable, true);
  for (const h of hits) {                 // walk up to the body carrying .focus
    let o = h.object;
    while (o && !o.userData.focus) o = o.parent;
    if (o) return o.userData.focus;
  }
  return null;
}

canvas.addEventListener('pointerdown', (ev) => { _down.x = ev.clientX; _down.y = ev.clientY; });
canvas.addEventListener('pointerup', (ev) => {
  if (manager.activeId !== 'solar' || manager.ease) return;
  if (Math.hypot(ev.clientX - _down.x, ev.clientY - _down.y) > 5) return;   // was a drag
  const info = _pickFocus(ev);
  if (info) views.solar.focusOn(info);    // hit → frame it (or re-frame another)
  else      views.solar.exitFocus();      // empty space → back out
});
canvas.addEventListener('pointermove', (ev) => {
  if (manager.activeId !== 'solar') { canvas.style.cursor = ''; return; }
  canvas.style.cursor = _pickFocus(ev) ? 'pointer' : '';
});

// Mission Plan launch button
// Starts (or replays) the guided flight sequence for the current view. While a
// sequence is playing the button is inert — exit/replay live on the timeline bar.
missionCta.addEventListener('click', () => {
  const v = views[manager.activeId];
  if (!v || !v.director || v.director.active) return;
  v.director.start();
});

// Speed control
const speedInput = document.getElementById('speed');
const speedLabel = document.getElementById('speedVal');
speedInput.addEventListener('input', () => {
  speedLabel.textContent = parseFloat(speedInput.value).toFixed(2) + '×';
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// Boot
manager.switchTo('solar', true);   // home view, no camera animation on load

function animate() {
  requestAnimationFrame(animate);
  const dt    = Math.min(clock.getDelta(), 0.05);   // clamp to survive tab-switch stalls
  const speed = parseFloat(speedInput.value);
  manager.update(dt, speed);
  animatePlumes(clock.getElapsedTime());                // shimmer any powered exhaust
  if (starfield) starfield.rotation.y += dt * 0.004;   // slow celestial drift
  composer.render();
}
animate();
</script>
</body>
</html>
