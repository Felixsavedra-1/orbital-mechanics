    controls.maxDistance = next.pose.max;

    if (instant) {
      camera.position.copy(next.pose.pos);
      controls.target.copy(next.pose.target);
    } else {
      this.ease = { fromPos: camera.position.clone(), toPos: next.pose.pos.clone(),
                    fromTgt: controls.target.clone(), toTgt: next.pose.target.clone(),
                    t: 0, dur: 0.55 };
    }
  },

  // Ease the camera in to frame a single body, then hand off to the OrbitControls
  // turntable (slow auto-rotate) once the transition lands.
  focusCamera(pos, target, min, max) {
    controls.autoRotate = false;   // off during the glide, on once we arrive
    this._focusPending = true;
    this.chase = null;
    controls.minDistance = min;
    controls.maxDistance = max;
    this.ease = { fromPos: camera.position.clone(), toPos: pos.clone(),
                  fromTgt: controls.target.clone(), toTgt: target.clone(),
                  t: 0, dur: 0.7 };
  },
  // One-shot cinematic glide (no turntable, no restore) — used by Mission Plan phases.
  cineGlide(pos, target, { min, max, dur = 1.0 } = {}) {
    controls.autoRotate = false;
    this._focusPending = false;
    this.chase = null;
    if (min != null) controls.minDistance = min;
    if (max != null) controls.maxDistance = max;
    this.ease = { fromPos: camera.position.clone(), toPos: pos.clone(),
                  fromTgt: controls.target.clone(), toTgt: target.clone(), t: 0, dur };
  },
  // Close tracking shot for a Mission Plan phase: trail a moving subject
  // (anchorFn → world position) from behind its direction of travel. Re-framing
  // between phases is continuous — the trail direction is seeded from the current
  // camera pose and update() eases everything over.
  startChase({ track, back, up, min, max, tau }) {
    controls.autoRotate = false;
    this._focusPending = false;
    this.ease = null;                        // a chase takes over from any glide
    if (min != null) controls.minDistance = min;
    if (max != null) controls.maxDistance = max;
    const dir = track().clone().sub(camera.position);
    dir.y *= 0.4;
    if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
    this.chase = { anchor: track, back, up, tau: tau || 0.6,
                   dir: dir.normalize(), prev: track().clone(), vel: new THREE.Vector3() };
  },
  stopChase() { this.chase = null; },
  // Ease back out to the view's default framing and stop the turntable.
  unfocusCamera(pose) {
    controls.autoRotate = false;
    this._focusPending = false;
    this.chase = null;
    this.ease = { fromPos: camera.position.clone(), toPos: pose.pos.clone(),
                  fromTgt: controls.target.clone(), toTgt: pose.target.clone(),
                  t: 0, dur: 0.6, restore: pose };
  },

  update(dt, speed) {
    if (this.ease) {
      this.ease.t += dt / this.ease.dur;
      const k = Math.min(this.ease.t, 1);
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;   // easeInOutQuad
      camera.position.lerpVectors(this.ease.fromPos, this.ease.toPos, e);
      this._tgt.lerpVectors(this.ease.fromTgt, this.ease.toTgt, e);
      controls.target.copy(this._tgt);
      camera.lookAt(this._tgt);
      if (k >= 1) {
        const done = this.ease;
        this.ease = null;
        if (done.restore) { controls.minDistance = done.restore.min; controls.maxDistance = done.restore.max; }
        if (this._focusPending) { controls.autoRotate = true; controls.autoRotateSpeed = 0.8; this._focusPending = false; }
      }
    } else if (this.chase) {
      // Trail the subject from behind its smoothed direction of travel — a real
      // chase shot. The target tracks near-instantly (the ship stays centered);
      // only the eye eases, with velocity feed-forward so the smoothing lag never
      // lets a fast phase shrink the ship to a dot.
      const c = this.chase;
      const anchor = c.anchor();
      c.vel.subVectors(anchor, c.prev).divideScalar(Math.max(dt, 1e-4));
      const jump = c.prev.distanceTo(anchor);
      c.prev.copy(anchor);
      if (jump > 60) {                       // subject teleported (replay): hard cut
        c.vel.set(0, 0, 0);
      } else if (c.vel.length() > 0.3) {
        _chaseV.copy(c.vel);
        _chaseV.y *= 0.4;                    // keep the shot low and lateral
        if (_chaseV.lengthSq() > 1e-8)
          c.dir.lerp(_chaseV.normalize(), 1 - Math.exp(-dt / 0.45)).normalize();
      }
      _chaseV.copy(anchor).addScaledVector(c.vel, c.tau * 0.85)
             .addScaledVector(c.dir, -c.back);
      _chaseV.y += c.up;
      if (jump > 60) {
        camera.position.copy(_chaseV);
        controls.target.copy(anchor);
      } else {
        camera.position.lerp(_chaseV, 1 - Math.exp(-dt / c.tau));
        controls.target.lerp(anchor, 1 - Math.exp(-dt / 0.12));
      }
      camera.lookAt(controls.target);
    } else {
      controls.update();
    }
    views[this.activeId].update(dt, speed);
    views[this.activeId].labels.update();
  },
};

// Tab + keyboard wiring
tabEls.forEach((t) => t.addEventListener('click', () => manager.switchTo(t.dataset.view)));
window.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') {
    const v = views[manager.activeId];
    if (v && v.director && (v.director.active || v.director.done)) { v.director.stop(); return; }
    views.solar.exitFocus();
    return;
  }
  if (ev.key >= '1' && ev.key <= '3') manager.switchTo(ORDER[+ev.key - 1]);
  else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
    const i = ORDER.indexOf(manager.activeId);
    const d = ev.key === 'ArrowRight' ? 1 : -1;
    manager.switchTo(ORDER[(i + d + ORDER.length) % ORDER.length]);
  }
});

// Click-to-focus: pick a planet/Sun in the Solar System view
// A raycaster turns pointer taps into body selections. We distinguish a click
// from an OrbitControls drag by measuring pointer travel between down and up.
const _ray = new THREE.Raycaster();
const _ptr = new THREE.Vector2();
const _down = { x: 0, y: 0 };
const canvas = renderer.domElement;

function _pickFocus(ev) {
  _ptr.x = (ev.clientX / window.innerWidth) * 2 - 1;
  _ptr.y = -(ev.clientY / window.innerHeight) * 2 + 1;
  _ray.setFromCamera(_ptr, camera);
  const hits = _ray.intersectObjects(views.solar.focusable, true);
  for (const h of hits) {                 // walk up to the body carrying .focus
    let o = h.object;
    while (o && !o.userData.focus) o = o.parent;
    if (o) return o.userData.focus;
  }
  return null;
}

canvas.addEventListener('pointerdown', (ev) => { _down.x = ev.clientX; _down.y = ev.clientY; });
canvas.addEventListener('pointerup', (ev) => {
  if (manager.activeId !== 'solar' || manager.ease) return;
  if (Math.hypot(ev.clientX - _down.x, ev.clientY - _down.y) > 5) return;   // was a drag
  const info = _pickFocus(ev);
  if (info) views.solar.focusOn(info);    // hit → frame it (or re-frame another)
  else      views.solar.exitFocus();      // empty space → back out
});
canvas.addEventListener('pointermove', (ev) => {
  if (manager.activeId !== 'solar') { canvas.style.cursor = ''; return; }
  canvas.style.cursor = _pickFocus(ev) ? 'pointer' : '';
});

// Mission Plan launch button
// Starts (or replays) the guided flight sequence for the current view. While a
// sequence is playing the button is inert — exit/replay live on the timeline bar.
missionCta.addEventListener('click', () => {
  const v = views[manager.activeId];
  if (!v || !v.director || v.director.active) return;
  v.director.start();
});

// Speed control
const speedInput = document.getElementById('speed');
const speedLabel = document.getElementById('speedVal');
speedInput.addEventListener('input', () => {
  speedLabel.textContent = parseFloat(speedInput.value).toFixed(2) + '×';
});

// Zoom control — slider drives the camera's distance from its target (the wheel is
// disabled above). Log-mapped across the live [minDistance, maxDistance] band so the
// full slider travel spans whatever zoom range the current view/focus allows.
const zoomInput = document.getElementById('zoom');
const distFromSlider = (z) => {
  const min = controls.minDistance, max = controls.maxDistance;
  return max * Math.pow(min / max, z);             // z=0 far, z=1 near
};
const sliderFromDist = (d) => {
  const min = controls.minDistance, max = controls.maxDistance;
  if (min <= 0 || max <= min) return 0.5;
  return Math.min(1, Math.max(0, Math.log(d / max) / Math.log(min / max)));
};
function applyZoom(dist) {
  _zoomV.subVectors(camera.position, controls.target);
  const cur = _zoomV.length();
  if (cur < 1e-6) return;
  camera.position.copy(controls.target).addScaledVector(_zoomV, dist / cur);
}
zoomInput.addEventListener('input', () => {
  applyZoom(distFromSlider(parseFloat(zoomInput.value)));
  controls.update();
});
// Keep the thumb reflecting the true distance through eased glides, focus and tab
// switches. applyZoom sets the distance to exactly match the slider, so reading it back
// yields the same value — no feedback fight, no drag flag needed.
function syncZoomSlider() {
  _zoomV.subVectors(camera.position, controls.target);
  zoomInput.value = sliderFromDist(_zoomV.length());
}

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// Boot
manager.switchTo('solar', true);   // home view, no camera animation on load

function animate() {
  requestAnimationFrame(animate);
  const dt    = Math.min(clock.getDelta(), 0.05);   // clamp to survive tab-switch stalls
  const speed = parseFloat(speedInput.value);
  manager.update(dt, speed);
  syncZoomSlider();                                     // thumb tracks the live distance
  animatePlumes(clock.getElapsedTime());                // shimmer any powered exhaust
  if (starfield) starfield.rotation.y += dt * 0.004;   // slow celestial drift
  composer.render();
}
animate();
</script>

<!-- Branding visual: VR-03 portfolio orbit animation (self-contained, copied verbatim) -->
<script>
(function(){
  var GOLD='178,58,58', GREY='140,140,147', BONE='#E8E3D6', BONE_RGB='232,227,214';

  function grid(ctx,W,H){
    ctx.strokeStyle='rgba(38,38,43,0.85)'; ctx.lineWidth=1;
    for(var x=0;x<=W;x+=W/8){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(var y=0;y<=H;y+=H/8){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  }
  function dot(ctx,x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
  function ring(ctx,x,y,r,s){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle=s;ctx.lineWidth=1;ctx.stroke();}
  function glow(ctx,x,y,r,rgb,a){
    var g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba('+rgb+','+a+')'); g.addColorStop(1,'rgba('+rgb+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  function tail(ctx,pts,rgb,maxA,maxW){
    ctx.lineCap='round';
    for(var i=0;i<pts.length-1;i++){
      var f=1-i/(pts.length-1);
      ctx.strokeStyle='rgba('+rgb+','+(maxA*f).toFixed(3)+')';
      ctx.lineWidth=Math.max(0.4,maxW*f);
      ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[i+1].x,pts[i+1].y);ctx.stroke();
    }
    ctx.lineCap='butt';
  }

  function drawOrbit(ctx,W,H,t){
    grid(ctx,W,H);
    var cx=W*0.5, cy=H*0.5, UX=W*0.30, UY=H*0.30;   // screen length of Earth's orbit radius
    var k=1.524;                                      // real Mars/Earth semi-major axis ratio
    var e=(k-1)/(k+1), p=1*(1+e);                     // transfer ellipse, Sun at focus, perihelion=Earth
    var phi=t*0.12+0.6;                               // slow revolution of the whole configuration
    function sx(nx){return cx+nx*UX;} function sy(ny){return cy+ny*UY;}
    // orbits
    ctx.beginPath();ctx.ellipse(cx,cy,UX,UY,0,0,Math.PI*2);ctx.strokeStyle='rgba('+GREY+',0.30)';ctx.lineWidth=1;ctx.stroke();
    ctx.beginPath();ctx.ellipse(cx,cy,k*UX,k*UY,0,0,Math.PI*2);ctx.strokeStyle='rgba('+GREY+',0.20)';ctx.lineWidth=1;ctx.stroke();
    // Sun at focus
    glow(ctx,cx,cy,18,GOLD,0.5); dot(ctx,cx,cy,3,'rgba('+GOLD+',0.95)'); ring(ctx,cx,cy,6,'rgba('+GOLD+',0.28)');
    // planned transfer trajectory (dashed arc, perihelion at Earth -> aphelion at Mars)
    ctx.save();ctx.setLineDash([4,4]);ctx.beginPath();
    for(var i=0;i<=90;i++){var nu=i/90*Math.PI,r=p/(1+e*Math.cos(nu)),L=phi+nu;
      var X=sx(r*Math.cos(L)),Y=sy(r*Math.sin(L));if(i===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);}
    ctx.strokeStyle='rgba('+GOLD+',0.30)';ctx.lineWidth=1.1;ctx.stroke();ctx.restore();
    // Earth at departure node
    var eX=sx(Math.cos(phi)),eY=sy(Math.sin(phi));
    glow(ctx,eX,eY,7,BONE_RGB,0.45); dot(ctx,eX,eY,2.6,BONE); ring(ctx,eX,eY,5,'rgba(232,227,214,0.30)');
    // Mars at arrival node
    var mX=sx(-k*Math.cos(phi)),mY=sy(-k*Math.sin(phi));
    glow(ctx,mX,mY,9,GOLD,0.55); dot(ctx,mX,mY,2.8,'rgba('+GOLD+',0.95)'); ring(ctx,mX,mY,5.5,'rgba('+GOLD+',0.30)');
    // spacecraft in transit
    var tau=((t*0.22)%1+1)%1, nu=tau*Math.PI;
    var env=Math.min(1,Math.min(tau,1-tau)/0.08); if(env<0)env=0;
    var pts=[];
    for(var s=0;s<22;s++){var nv=nu-s*0.06; if(nv<0)break;
      var rr=p/(1+e*Math.cos(nv)),LL=phi+nv;pts.push({x:sx(rr*Math.cos(LL)),y:sy(rr*Math.sin(LL))});}
    ctx.globalAlpha=env;
    if(pts.length>1) tail(ctx,pts,GOLD,0.95,2.6);
    var rH=p/(1+e*Math.cos(nu)),LH=phi+nu;
    glow(ctx,sx(rH*Math.cos(LH)),sy(rH*Math.sin(LH)),7,GOLD,0.6); dot(ctx,sx(rH*Math.cos(LH)),sy(rH*Math.sin(LH)),2.2,BONE);
    ctx.globalAlpha=1;
  }

  var SCENES={orbit:drawOrbit};
  var items=[];
  [].forEach.call(document.querySelectorAll('canvas[data-scene]'), function(c){
    var fn=SCENES[c.getAttribute('data-scene')]; if(!fn) return;
    items.push({ctx:c.getContext('2d'), W:c.width, H:c.height, fn:fn});
  });
  if(!items.length) return;

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t=0;
  function frame(){ for(var i=0;i<items.length;i++){ var it=items[i]; it.ctx.clearRect(0,0,it.W,it.H); it.fn(it.ctx,it.W,it.H,t); } }
  if(reduce){ frame(); }
  else { (function loop(){ t+=0.011; frame(); requestAnimationFrame(loop); })(); }
})();
</script>
